const plain = (status) => (me && me.role !== "office" && PLAIN[status]) ? PLAIN[status][0] : String(status ?? "").replaceAll("_", " ");
const pill = (status, text) => {
  if (!text && me && me.role !== "office" && PLAIN[status]) return `<span class="badge s-${PLAIN[status][1]}">${esc(PLAIN[status][0])}</span>`;
  return `<span class="badge s-${esc(status)}">${label(text || status)}</span>`;
};

// -- light or dark, remembered per browser --------------------------------------------------------------------

function theme(set) {
  const now = set || remember("nts.theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  if (set) remember("nts.theme", set);
  document.documentElement.dataset.theme = now;
  if ($("themeBtn")) $("themeBtn").innerHTML = icon(now === "dark" ? "sun" : "moon", 15);  // as the demo app: the theme it switches to
  return now;
}

// the sidebar folds to icons, as the demo app's; remembered per browser, Ctrl B toggles it
function fold(set) {
  const folded = set === undefined ? remember("nts.sidebar.folded") === "1" : set;
  if (set !== undefined) remember("nts.sidebar.folded", folded ? "1" : "0");
  $("shell").classList.toggle("folded", folded);
  $("collapse").innerHTML = icon(folded ? "chevron" : "left", 13);
  $("collapse").title = folded ? "Expand the sidebar (Ctrl B)" : "Collapse the sidebar (Ctrl B)";
}
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); fold(!$("shell").classList.contains("folded")); }
});

async function enter() {
  $("shell").classList.remove("signed-out");
  dep = await api("/api/department");
  $("deptName").textContent = `${me.dept} · timetable agent`;
  const office = me.role === "office";
  const role = office ? "Timetable office" : ({teacher: "Teacher", club: "Club", student: "Class representative"}[me.role] || me.role);
  const shown = office ? "Office" : me.name;
  $("who").innerHTML = `
    <div class="status" title="${esc(dep.model)} · ${esc(dep.agent)}"><span class="live"></span><span>Agent connected · ${esc(dep.agent)}</span></div>
    <div class="me">
    <span class="userbox"><button class="user" id="userBtn" aria-haspopup="true" title="${esc(shown)} · ${esc(role)}">${avatar(shown)}
      <span class="user-text"><b>${esc(shown)}</b><span class="small">${esc(role)}</span></span></button>
      <div class="panel menu" id="userMenu" hidden><div id="people"></div>
        <button class="menu-item" id="logout">${icon("out", 15)} Sign out</button></div></span>
    ${me.role === "club" ? "" : `<span class="bellbox"><button class="iconbtn bell" id="bell" title="Notifications" aria-label="Notifications">${icon("bell", 15)}
      <span class="dot" id="bellDot" hidden></span></button><div class="panel bell-panel" id="bellPanel" hidden></div></span>`}
    <button class="iconbtn" id="themeBtn" title="Light or dark" aria-label="Light or dark"></button></div>`;
  theme();
  meta();
  $("themeBtn").onclick = () => theme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  $("userBtn").onclick = (e) => { e.stopPropagation(); $("userMenu").hidden = !$("userMenu").hidden; };
  document.onclick = (e) => {
    if ($("userMenu") && !e.target.closest(".userbox")) $("userMenu").hidden = true;
    if ($("bellPanel") && !e.target.closest(".bellbox")) $("bellPanel").hidden = true;
    if ($("moreMenu") && !e.target.closest(".morebox")) $("moreMenu").hidden = true;
  };
  if ($("bell")) { $("bell").onclick = (e) => { e.stopPropagation(); toggleBell(); }; refreshBell(); }
  $("logout").onclick = async () => { await api("/api/logout", {method: "POST"}); tabToken(""); me = null; chat = null; showLogin(); };
  document.title = `${shown} · Negotiate, Then Solve`;  // so each tab says who it is signed in as
  try {  // the demo app's person switcher: sign this tab in as someone else, or open a new tab as them
    const d = await api("/api/departments");
    if (!d.passwords) {
      const people = [["office", "Timetable office", "Timetable office"], ...dep.teachers.map((t) => [t, t, "Teacher"]),
        ...dep.sections.map((g) => [`rep: ${g}`, `${g} class rep`, "Class representative"])];
      $("people").innerHTML = `<p class="people-h">Switch person (demo sign-in) · each tab keeps its own</p><div class="people">${people.map(([key, name, r]) => {
        const cur = key === "office" ? office : key.startsWith("rep: ") ? me.section === key.slice(5) : me.name === key;
        return `<div class="person ${cur ? "cur" : ""}"><button class="person-go" data-as="${esc(key)}" ${cur ? "disabled" : ""}>${avatar(name)}
            <span><b>${esc(name)}</b><span class="small">${esc(r)}</span></span></button>
          <a class="iconbtn" href="${esc(tabLinkAs(key))}" target="_blank" rel="noopener" title="Open a new tab as ${esc(name)}; this tab stays as ${esc(shown)}"
            aria-label="Open a new tab as ${esc(name)}">${icon("external", 14)}</a></div>`;
      }).join("")}</div>`;
      for (const b of document.querySelectorAll("[data-as]")) b.onclick = () => switchTo(b.dataset.as);
    }
  } catch { /* the menu keeps Sign out */ }
  try {  // every course of the department gets its own colour, so two of one teacher's courses never look alike
    const all = await api(`/api/timetable?week=${remember("nts.week") || 5}`);
    [...new Set(all.classes.map((c) => c.course))].sort().forEach((c, i) => { COURSE_COLOR[c] = PALETTE[(i * 5) % PALETTE.length]; });
  } catch { /* no timetable yet: colours by name */ }
  // the page and what was open in it come back from the address (a refresh stays put); else the role's own home
  const [, v, id] = location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || [];
  const pages = navFor().flatMap(([, items]) => items.map((i) => i[0]));
  view = pages.includes(v) ? v : me.role === "club" ? "bookings" : "home";
  if (v === view && id) {
    if (view === "inbox") officeOpen = decodeURIComponent(id);
    else if (view === "requests" || view === "home") { chat = {id: decodeURIComponent(id)}; reqMode = "chat"; }
  }
  show(view);
  if (me.role === "office") officeDot();
  clearInterval(timer); timer = setInterval(() => {
    if ($("msgs")) { refreshLists(); freshen(); }
    if ($("rList")) refreshReqList();
    if (view === "inbox") refreshOffice();
    else if (me.role === "office") { officeDot(); if (view === "home") drawDash(); }
    refreshBell();
  }, 4000);
}

async function officeDot() {  // what waits for the office, on the Inbox in the sidebar
  try { const items = await api("/api/office/requests"); railDot("inbox", items.filter((c) => c.needs_office).length); } catch { /* restarting */ }
}

function railDot(tab, n) {  // a count on a section of the rail: what waits for you there
  const d = document.querySelector(`[data-dot="${tab}"]`);
  if (d) { d.textContent = n ? String(n) : ""; d.hidden = !n; }
}

function meta() { if ($("meta")) $("meta").textContent = `${dep.model} · ${dep.agent} · version ${dep.version.slice(0, 8)}`; }

// each page's heading, as the demo app's page headers: a serif title and one line under it
const PAGES = {
  timetable: ["This week", "Every class of the week: by teacher, by section or by room. Click a class to ask about it or change it."],
  bookings: ["Club activities", "Rooms booked by clubs. A booking closes the room for teaching at that time."],
  fairness: ["Fairness", "Who has given way for other people's requests, and how much."],
  rules: ["Handbook", "The department's timetable regulations. The agent checks every change against them."],
  semester: ["Semester plan", "Solve the semester timetable again with every standing rule and wish, then publish it."],
  how: ["How it works", "Follow one message from the chat to the timetable. The model reads and drafts; the solver checks, colleagues agree, and the office decides."],
  obs: ["System health", "What the agent did: episodes, tool calls, refusals and eval reports."],
};

// each role's menu, grouped as the demo app's sidebar (components/Shell.tsx): what the role is responsible for comes
// first. A teacher lives in their week (Home) and their requests; the office works a queue (Home is the dashboard,
// then the Inbox of changes to approve); a club books rooms.
function navFor() {
  if (me.role === "office") return [
    [null, [["home", "Home", "home"], ["inbox", "Inbox", "inbox"], ["requests", "Requests", "list"], ["timetable", "This week", "calendar"]]],
    ["Semester", [["semester", "Semester plan", "layers"], ["bookings", "Club activities", "music"]]],
    ["Reference", [["fairness", "Fairness", "scale"], ["rules", "Handbook", "book"], ["how", "How it works", "route"]]],
    ["Research", [["obs", "System health", "activity"]]]];
  if (me.role === "club") return [[null, [["bookings", "Club activities", "music"], ["rules", "Handbook", "book"], ["how", "How it works", "route"]]]];
  if (me.role === "student") return [[null, [["home", "Home", "home"], ["requests", "Requests", "list"], ["rules", "Handbook", "book"]]],
    ["More", [["timetable", "This week", "calendar"], ["how", "How it works", "route"]]]];
  return [[null, [["home", "Home", "home"], ["requests", "Requests", "list"], ["rules", "Handbook", "book"]]],
    ["More", [["timetable", "This week", "calendar"], ["fairness", "Fairness", "scale"], ["how", "How it works", "route"]]]];
}

// the page, and the conversation or inbox item open in it, in the address (#/requests/<thread>, #/inbox/<id>), like
// the demo app's routes: a refresh stays where it was, and each tab keeps its own
function place() {
  if (!me) return;
  let h = `#/${view}`;
  if ((view === "home" || (view === "requests" && reqMode === "chat")) && chat?.id) h += `/${encodeURIComponent(chat.id)}`;
  if (view === "inbox" && officeOpen) h += `/${encodeURIComponent(officeOpen)}`;
  if (location.hash !== h) history.pushState(null, "", h);
}

addEventListener("popstate", () => {  // Back and Forward move between the pages this tab has been on
  if (!me) return;
  const [, v, id] = location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || [];
  if (!v) return;
  chat = (v === "requests" || v === "home") && id ? {id: decodeURIComponent(id)} : null;
  if (v === "inbox") officeOpen = id ? decodeURIComponent(id) : null;
  reqMode = chat ? "chat" : "list";
  replaying = true; show(v); replaying = false;
});
let replaying = false;

function show(which) {
  view = which;
  closeClassMenu();
  const item = ([k, l, i]) => `<button data-tab="${k}" class="${k === which ? "on" : ""}" title="${l}">${icon(i, 16)}<span class="lbl">${l}</span>
      <span class="dot rail-dot" data-dot="${k}" hidden></span></button>`;
  $("nav").innerHTML = navFor().map(([group, items]) => (group ? `<p class="nav-group">${group}</p><div class="nav-sep"></div>` : "")
    + items.map(item).join("")).join("");
  document.onkeydown = null;
  if (which === "home") me.role === "office" ? dashView() : homeView();
  else if (which === "inbox") officeView();
  else if (which === "requests") (me.role === "office" && reqMode === "list" ? requestsListView : requestsView)();
  else {
    const [title, sub] = PAGES[which] || [which, ""];
    $("app").innerHTML = `<main class="wide"><div class="page-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
      <span class="small" id="headNote"></span></div><div id="pane" class="panel stack"></div></main>`;
    ({timetable: timetableView, bookings: bookingsView, fairness: fairnessView, rules: rulesView, semester: semesterView,
      obs: obsView, how: howView})[which](); }
  for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => { if (b.dataset.tab === "requests") reqMode = "list"; show(b.dataset.tab); };
  if (!replaying) place();
}

// -- chat: conversations (threads) of requests ------------------------------------------------------------
// Each message is one agent episode; a thread is a conversation of them, and the agent remembers the earlier
// messages of the thread. Its steps fold into "Thinking", open while it works.

const STEP = {
  find: "Looked up a name", describe: "Read the details", classes_of: "Checked the classes", free_hours: "Checked free hours",
  who_is_free: "Checked who is free", free_rooms: "Checked free rooms", changes: "Checked recent changes", rules: "Searched the regulations",
  constrain: "Drafted a rule", move_class: "Drafted a move", retract: "Took back part of the draft", list_draft: "Read the draft",
  swap_classes: "Drafted a swap", cancel_class: "Drafted a cancellation", add_class: "Drafted an extra class",
  limit_hours: "Drafted an hours limit", book_room: "Drafted a room booking", move_to_window: "Drafted a move to a time window",
  limit_load: "Drafted a load limit", relate_classes: "Drafted how classes relate", choose: "Drafted a choice between options",
  set_weeks: "Set the weeks", check_draft: "Checked the draft with the solver", submit: "Sent the draft to the office",
  decline: "Declined", escalate: "Passed it to the office",
};
const REP_TRIES = ["What classes do we have on Monday?", "When are we free on Wednesday afternoon?",
  "Two of our Tuesday classes seem to clash, can you check?"];
let chat = null;  // the open conversation: {id, mine, episodes: [...]}, or null for a new one
let threadList = [];  // the sidebar's conversations, for the search box
const ownsWeek = () => me.role === "teacher" || me.role === "student";  // a home with their week and the chat beside it
const chatTab = () => (ownsWeek() ? "home" : "requests");  // where a teacher's conversations open: beside their week
let inboxList = [];  // colleagues' requests that wait for this person's answer

// the office's Requests page, as the demo app's: every request in a list with tabs; one opens as its conversation
let reqMode = "list", reqWho = "everyone", reqTab = "all";
const REQ_TABS = {progress: ["running", "waiting", "submitted", "escalated"], done: ["approved", "answered"],
  stopped: ["declined", "rejected", "stuck", "not_committed", "model_error", "budget_exhausted", "stopped", "replaced", "undone", "interrupted"]};

function requestsListView() {
  $("app").innerHTML = `<main class="wide"><div class="page-head"><div><h1>Requests</h1>
      <p>Everything teachers asked the agent. Open a request to see the conversation and how the agent handled it, step by step.</p></div>
      <div class="row"><button class="primary" id="rNew">${icon("plus", 15)} New request</button></div></div>
    <div class="box"><div class="req-bar"><div class="filters" id="rWho"></div><div class="filters" id="rTab"></div>
      <label class="search grow">${icon("search", 15)}<input id="rFind" placeholder="Find a request or a teacher"></label></div>
      <div id="rList"><div class="empty">Loading…</div></div></div></main>`;
  $("rNew").onclick = () => { chat = null; reqMode = "chat"; show("requests"); };
  $("rFind").oninput = drawReqList;
  refreshReqList();
}

async function refreshReqList() {
  try { threadList = await api("/api/threads"); } catch { return; }
  drawReqList();
}

function drawReqList() {
  if (!$("rList")) return;
  const q = $("rFind").value.trim().toLowerCase();
  const byWho = threadList.filter((t) => reqWho === "everyone" || t.mine);
  const count = (k) => byWho.filter((t) => k === "all" || REQ_TABS[k].includes(t.status)).length;
  $("rWho").innerHTML = [["everyone", "Everyone"], ["mine", "Mine"]].map(([k, l]) => `<button data-rwho="${k}" class="${reqWho === k ? "on" : ""}">${l}</button>`).join("");
  $("rTab").innerHTML = [["all", "All"], ["progress", "In progress"], ["done", "Done"], ["stopped", "Stopped"]].map(([k, l]) =>
    `<button data-rtab="${k}" class="${reqTab === k ? "on" : ""}">${l} <span class="small">${count(k) || ""}</span></button>`).join("");
  const shown = byWho.filter((t) => (reqTab === "all" || REQ_TABS[reqTab].includes(t.status))
    && (!q || `${t.title} ${t.actor}`.toLowerCase().includes(q))).sort((a, b) => (a.updated < b.updated ? 1 : -1));
  $("rList").innerHTML = shown.length ? shown.map((t) => `<div class="rowlink" data-thread="${esc(t.id)}">${avatar(t.actor, "sm")}
      <div class="grow"><div class="req">${esc(t.title)}</div><div class="small">${esc(t.actor)}${t.week ? ` · week ${t.week}` : ""} · ${esc(when(t.updated))}${t.messages > 1 ? ` · ${t.messages} messages` : ""}</div></div>
      ${pill(t.status)}</div>`).join("") : `<div class="empty">${icon("list", 22)}<b>No requests here</b><span>${q ? "Nothing matches your search." : "Requests teachers send to the agent show up here."}</span></div>`;
  for (const b of document.querySelectorAll("[data-rwho]")) b.onclick = () => { reqWho = b.dataset.rwho; drawReqList(); };
  for (const b of document.querySelectorAll("[data-rtab]")) b.onclick = () => { reqTab = b.dataset.rtab; drawReqList(); };
  for (const x of document.querySelectorAll("#rList [data-thread]")) x.onclick = () => openThread(x.dataset.thread);
}

async function freshen() {  // the office may decide or write while a chat is open: fetch it again when idle
  if (!chat?.episodes || chat.episodes.some((e) => e.busy || e.status === "running")) return;
  try {
    const now = await api(`/api/threads/${chat.id}`);
    if (chat?.id === now.id && JSON.stringify(now) !== JSON.stringify(chat)) { chat = now; draw(); }
  } catch { /* gone, or the server is restarting */ }
}

function sideToggle() {  // the side bar folds away, as in a chat app; the choice is remembered
  const main = document.querySelector("main.chat");
  main.classList.toggle("closed", remember("nts.side") === "closed");
  for (const b of document.querySelectorAll(".side-btn")) b.onclick = () => remember("nts.side", main.classList.toggle("closed") ? "closed" : "open");
}

let filter = "all";  // the sidebar's status chips
const FILTERS = [["all", "All"], ["approved", "Approved"], ["declined", "Declined"], ["answered", "Answered"]];
const FILTERED = {approved: ["approved"], declined: ["declined", "rejected", "stuck", "not_committed"], answered: ["answered"]};

// what each person can do in one click: [action, icon, title, line]
const CARDS = () => me.role === "office"
  ? [["inbox", "inbox", "Open the inbox", "Changes waiting for approval"], ["rooms", "search", "Find a free room", "Rooms free at a time you pick"],
     ["closure", "door", "Close a room", "Maintenance, an event, an exam"]]
  : [["timetable", "calendar", "View my timetable", "This week's classes and rooms"], ["free", "search", "Find free slots", "Your free hours this week"],
     ["absence", "away", "Report an absence", "Cancel or move a day's classes"]];

// the demo app's Requests page (pages/RequestChat.tsx): the list in a card on the left (your requests, or what
// colleagues asked of you), the conversation in a card on the right
let reqSide = "mine";

function requestsView() {
  $("app").innerHTML = `<main class="rq">
    <section class="box rq-list">
      <div class="rq-head">${me.role === "office" ? `<button class="iconbtn" id="backList" title="All requests" aria-label="All requests">${icon("left", 16)}</button>` : ""}
        <h1>Requests</h1><button class="primary sm" id="newChat" title="New request (N)">${icon("plus", 14)} New</button></div>
      <div class="rq-tabs"><button data-side="mine" class="${reqSide === "mine" ? "on" : ""}">Your requests</button>
        <button data-side="asked" class="${reqSide === "asked" ? "on" : ""}">Asked of you <span class="count-pill" id="askedN" hidden></span></button></div>
      <label class="rq-find">${icon("search", 14)}<input id="find" placeholder="Find a request or message" aria-label="Find a request"></label>
      <div class="rq-items">
        <ul class="list" id="threads" ${reqSide === "mine" ? "" : "hidden"}></ul>
        <section id="inboxBox" ${reqSide === "asked" ? "" : "hidden"}><ul class="list" id="inbox"></ul>
          <p class="small none-msg" id="inboxNone">Nothing waits for your answer. When a colleague's request needs one of your classes, the agent asks you here.</p></section>
      </div>
    </section>
    <section class="box rq-chat">
      <div class="rq-chat-h"><div class="grow head-text stacked"><b id="chatTitle">New request</b><span class="small" id="chatSub"></span></div></div>
      <div id="msgs" class="msgs"></div>
      <div class="composer">
        <textarea id="text" rows="2"></textarea>
        <div class="row"><input type="hidden" id="week">${/* the current week; a message that names another week says so itself */ ""}
          <label class="switch" title="Simple stand-ins answer the agent's questions to other teachers"><input type="checkbox" id="simulate"><span class="track"></span>Stand-ins</label>
          <span class="small" id="sendErr"></span><button class="send primary" id="send" aria-label="Send" title="Send (Enter)">${icon("send", 15)}</button></div>
      </div>
    </section></main>`;
  $("week").value = remember("nts.week") || 5;
  $("simulate").checked = dep.simulate;
  $("send").onclick = send;
  if ($("backList")) $("backList").onclick = () => { reqMode = "list"; show("requests"); };
  $("newChat").onclick = newChat;
  $("find").oninput = drawThreads;
  for (const b of document.querySelectorAll("[data-side]")) b.onclick = () => {
    reqSide = b.dataset.side;
    for (const x of document.querySelectorAll("[data-side]")) x.classList.toggle("on", x === b);
    $("threads").hidden = reqSide !== "mine"; $("inboxBox").hidden = reqSide !== "asked";
  };
  document.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && $("find")) { e.preventDefault(); $("find").focus(); }
    else if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && $("newChat")
             && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) { e.preventDefault(); newChat(); }
  };
  $("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $("text").oninput = grow;
  refreshLists();
  if (pendingText) { const t = pendingText; pendingText = null; compose(t); }
  else if (chat?.id) openThread(chat.id); else draw();
}

function newChat() { chat = null; if (source) source.close(); draw(); drawThreads(); place(); $("text").focus(); }

async function send() {
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true; $("sendErr").textContent = "";
  try {
    const ep = await api("/api/episodes", {method: "POST", body: JSON.stringify({request: text, week: Number($("week").value),
      simulate: $("simulate").checked, thread: chat?.mine ? chat.id : null})});
    $("text").value = ""; grow();
    await openThread(ep.thread);
  } catch (e) { $("sendErr").textContent = e.message; $("send").disabled = false; }
}

async function refreshLists() {
  if (!$("threads") && !$("convSel")) return;
  try {
    const [ts, inbox] = await Promise.all([api("/api/threads"), api("/api/inbox")]);
    threadList = ts; inboxList = inbox;
    drawThreads();
    drawConvSel();
    if ($("inbox")) {
      if ($("inboxNone")) $("inboxNone").hidden = !!inbox.length;
      if ($("askedN")) { $("askedN").textContent = inbox.length; $("askedN").hidden = !inbox.length; }
      $("inbox").innerHTML = inbox.map((e) => `<li data-thread="${esc(e.thread)}"><span class="li-icon">${icon("mail")}</span>
        <div class="grow"><div class="req">${esc(e.pending?.text || e.request)}</div><div class="small">from ${esc(e.actor)}</div></div></li>`).join("");
      for (const li of document.querySelectorAll("#inbox li[data-thread]")) li.onclick = () => openThread(li.dataset.thread);
    }
    railDot(chatTab(), inbox.length);
  } catch { /* the server may be restarting */ }
}

// the conversation switcher on a teacher's home (the demo app's ConversationSwitcher): a new request, what
// colleagues asked of you, and your own requests with where each stands
function drawConvSel() {
  const sel = $("convSel");
  if (!sel || document.activeElement === sel) return;
  const cut = (s) => { s = String(s || ""); return s.length > 60 ? `${s.slice(0, 58)}…` : s; };
  const mine = threadList.filter((t) => t.mine).slice(0, 40);
  sel.innerHTML = `<option value="">New request</option>`
    + (inboxList.length ? `<optgroup label="Waiting for your answer">${inboxList.map((e) =>
        `<option value="${esc(e.thread)}">${esc(cut(e.pending?.text || e.request))} · ${esc(e.actor)}</option>`).join("")}</optgroup>` : "")
    + (mine.length ? `<optgroup label="Your requests">${mine.map((t) =>
        `<option value="${esc(t.id)}">${esc(cut(t.title))} · ${esc(plain(t.status))}</option>`).join("")}</optgroup>` : "");
  sel.value = chat?.id && [...sel.options].some((o) => o.value === chat.id) ? chat.id : "";
}

function drawThreads() {
  if (!$("threads")) return;
  const q = ($("find")?.value || "").trim().toLowerCase();
  // a teacher's own requests (what they were asked is under "Asked of you"); the office sees every conversation
  const shown = threadList.filter((t) => (me.role === "office" || t.mine)
    && (!q || t.title.toLowerCase().includes(q) || (t.actor || "").toLowerCase().includes(q))
    && (filter === "all" || FILTERED[filter].includes(t.status))).sort((a, b) => (a.updated < b.updated ? 1 : -1));
  if ($("recentN")) $("recentN").textContent = shown.length || "";
  $("threads").innerHTML = shown.length ? shown.map((t) => `<li data-thread="${esc(t.id)}" class="${chat?.id === t.id ? "sel" : ""}">
      <div class="grow"><div class="req">${esc(t.title)}</div>
      <div class="small">${t.week ? `Week ${t.week} · ` : ""}${esc(when(t.updated))}${t.messages > 1 ? ` · ${t.messages} messages` : ""}${t.mine ? "" : ` · ${esc(t.actor)}`}</div></div>
      ${pill(t.status)}</li>`).join("") : `<li class="small none">${q ? "No request matches." : "No requests yet. Write one with New."}</li>`;
  for (const li of document.querySelectorAll("#threads li[data-thread]")) li.onclick = () => openThread(li.dataset.thread);
}

async function openThread(id) {
  if (!$("msgs")) { chat = {id}; reqMode = "chat"; show(ownsWeek() ? "home" : "requests"); return; }
  if (source) source.close();
  chat = await api(`/api/threads/${id}`);
  place();
  draw(); follow(); refreshLists();
}

function follow() {  // the last message's events, live
  const last = chat?.episodes?.at(-1);
  if (!last || !(last.busy || last.status === "running")) return;
  const id = chat.id, ep = last;
  source = new EventSource(`/api/episodes/${ep.id}/events?after=${ep.events.length}&token=${encodeURIComponent(tabToken() || "")}`);
  const take = async (msg) => {
    const e = JSON.parse(msg.data);
    if (chat?.id !== id || e.n < ep.events.length) return;
    ep.events.push(e);
    if (["end", "waiting", "decision"].includes(e.type)) { await openThread(id); return; }
    draw();
  };
  for (const t of ["model", "model_error", "tool", "reply", "waiting", "end", "decision", "note"]) source.addEventListener(t, take);
  source.onerror = () => source.close();  // the server ends the stream when the episode ends or waits
}

const args = (a) => Object.entries(a || {}).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");
const brief = (a) => Object.values(a || {}).filter((v) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
  .map((v) => Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v)).join(" · ");

function stepHtml(e) {  // one step of the agent's work, in words; the raw call and result one click further
  if (e.type === "model") return e.text && e.calls.length ? `<li class="note">${esc(e.text)}</li>` : "";
  if (e.type === "tool") return `<li class="${e.ok ? "" : "bad"}">${e.ok ? "✓" : "✗"} ${esc(STEP[e.name] || e.name)}
      <span class="small">${esc(brief(e.arguments))}</span>${e.ok ? "" : ` <span class="small">: ${esc(e.result?.message || "")}</span>`}
      <details><summary>details</summary><div class="call">${esc(e.name)}(${esc(args(e.arguments))})</div><pre>${esc(JSON.stringify(e.result, null, 1))}</pre></details></li>`;
  if (e.type === "reply") {
    const what = e.kind === "offer" ? `Asked ${esc(e.to)} to waive “${esc(e.rule)}”` : e.kind === "notice" ? `Told ${esc(e.to)}` : `Asked ${esc(e.to)}`;
    const ans = e.kind === "notice" ? "" : ` → ${e.answer === "no_reply" ? "<i>no reply</i>" : `<b>${esc(e.answer)}</b> ${esc(e.says)}`}`;
    return `<li>💬 ${what}: “${esc(e.text)}”${ans}</li>`;
  }
  if (e.type === "model_error") return `<li class="bad">✗ The model failed: ${esc(e.error?.message || "")}</li>`;
  return "";
}

// what happened to a change, said as a card: [icon, kind, title, line]
function outcome(c) {
  const d = c.decision;
  if (d?.undone) return ["undo", "muted", "Undone by the office", "This change is no longer in the timetable."];
  if (d?.approved) return ["check", "ok", "Request approved", "The office approved it: it is in the timetable now."];
  if (d) return ["x", "bad", "Not approved", d.note || "The office did not approve it."];
  if (c.status === "replaced") return ["undo", "muted", "Replaced", "A later message replaced this draft."];
  if (c.status === "submitted") return ["clock", "warn", "Sent to the office", c.stale ? "The timetable changed since this was drafted: send it again." : "Waiting for the office to approve it."];
  return null;
}

function changesHtml(lines) {
  return `<div class="changes"><div class="small">Proposed changes (${lines.length})</div>${lines.map((l) =>
    `<div class="change"><span class="li-icon">${icon("calendar", 16)}</span><span>${esc(l)}</span></div>`).join("")}</div>`;
}

function episodeHtml(c) {
  const steps = c.events.map(stepHtml).filter(Boolean), working = c.busy || c.status === "running";
  const ms = c.events.reduce((t, e) => t + (e.ms || 0), 0), p = c.pending, can = c.can || {};
  let html = `<div class="msg user"><div class="col"><div class="bubble">${esc(c.request)}</div><div class="small stamp">${esc(c.started.slice(11, 16))}</div></div>
    <span class="avatar">${initial(me.name)}</span></div>
    <div class="msg agent"><span class="avatar bot">${icon("bot", 20)}</span><div class="col">`;
  // folded, as in ChatGPT: one quiet line ("Thinking…" with the step under way, then "Thought for 6.2 s"); a click opens it
  const now = c.events.findLast((e) => e.type === "tool");
  if (steps.length || working) html += `<details class="thinking"><summary>${icon("chevron", 14)}<span class="${working ? "shimmer" : ""}">${working
      ? `Thinking…${now ? ` ${esc(STEP[now.name] || now.name)}` : ""}` : `Thought for ${(ms / 1000).toFixed(1)} s`}</span></summary>
      <ol>${steps.join("")}${working ? `<li class="small">working…</li>` : ""}</ol></details>`;
  const end = c.events.findLast((e) => e.type === "end");
  if (!working && !p) {
    const text = c.text || end?.text || c.detail || end?.detail || "";
    const quiet = ["answered", "submitted", "approved", "rejected", "replaced", "undone", "not_committed", "stopped"].includes(c.status);
    html += `<div class="bubble">${quiet ? "" : `${pill(c.status)} `}${esc(text)}</div>`;
  }
  if (p && !c.busy) {
    if (p.to_requester && c.can?.answer) html += `<div class="bubble ask">${esc(p.text)}
      ${p.options?.length ? `<div class="picks">${p.options.map((o) => `<button class="pick" data-pick="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
      <div class="small">${p.options?.length ? "Pick one, or write your own answer below." : "Answer in the box below."}</div></div>`;
    else html += `<div class="callout stack"><div class="small">${p.kind === "offer" ? `An offer for ${esc(p.to)}` : `A question for ${esc(p.to)}`}</div>
      <div>“${esc(p.text)}”</div>${p.rule ? `<div class="small">Their rule: ${esc(p.rule)}; waived in ${p.weeks.length ? "week " + p.weeks.join(", ") : "every week"}</div>` : ""}
      ${can.answer ? `<textarea data-answer="${esc(c.id)}" placeholder="${p.kind === "offer" ? "Say why (optional)" : "Your answer"}"></textarea>
      <div class="row">${p.kind === "offer" ? `<button class="primary" data-a="yes" data-ep="${esc(c.id)}">Agree</button><button data-a="no" data-ep="${esc(c.id)}">Refuse</button>` :
        `<button class="primary" data-a="said" data-ep="${esc(c.id)}">Answer</button>`}<button data-a="no_reply" data-ep="${esc(c.id)}">Don't answer</button></div>` :
        `<div class="small">Waiting for ${esc(p.to)} to answer.</div>`}</div>`;
  }
  const o = outcome(c);
  if (o) {
    html += `<div class="result ${o[1]}"><div class="result-head"><span class="result-icon">${icon(o[0], 22)}</span><div><b>${o[2]}</b><div>${esc(o[3])}</div></div></div>
      ${c.draft.length ? changesHtml(c.draft) : ""}
      ${can.decide && !c.stale ? `<div class="row"><button class="primary" data-decide="approve" data-ep="${esc(c.id)}">Approve and commit</button>
        <input data-note="${esc(c.id)}" placeholder="Note (for a rejection)"><button class="danger" data-decide="reject" data-ep="${esc(c.id)}">Reject</button></div>` : ""}</div>`;
  }
  html += c.notes.map((n) => `<div class="bubble office"><div class="small">${icon("mail", 14)} The office · ${esc((n.at || "").slice(11, 16))}</div>${esc(n.text)}</div>`).join("");
  return html + "</div></div>";
}

function act(what) {  // a quick action, from the header or a welcome card
  if (what === "timetable") show(ownsWeek() ? "home" : "timetable");
  else if (what === "inbox") show("inbox");
  else if (what === "new") newChat();
  else {
    newChat();
    $("text").value = {free: `When am I free in week ${$("week").value}?`, rooms: `Which rooms are free on Monday at 10 am in week ${$("week").value}?`,
      absence: "I'm away on  in week " + $("week").value + ", please cancel my classes that day.",
      closure: `Room  is closed on  in week ${$("week").value} for maintenance.`}[what] || "";
    if (what === "free") send(); else $("text").focus();
  }
}

function draw() {
  if (!$("msgs")) return;
  for (const li of document.querySelectorAll("#threads li")) li.classList.toggle("sel", li.dataset.thread === chat?.id);
  const first = chat?.episodes?.[0], last = chat?.episodes?.at(-1), p = last?.pending;
  if ($("chatTitle")) {
    $("chatTitle").textContent = first ? first.request : "New request";
    $("chatSub").textContent = first ? `Week ${last.week ?? "–"} · ${when(first.started)}${chat.mine ? "" : ` · ${first.actor}`}` :
      me.role === "office" ? "Ask about rooms and people, or make a change"
      : me.role === "student" ? `Ask about ${me.section}'s timetable, or pass a request to the office` : "Ask about your timetable, or ask for a change";
  }
  if ($("convSel") && document.activeElement !== $("convSel")) {
    $("convSel").value = chat?.id && [...$("convSel").options].some((o) => o.value === chat.id) ? chat.id : "";
  }
  $("text").placeholder = !chat ? (me.role === "office" ? "Ask about rooms and people, or close a room…" :
      me.role === "student" ? "Ask about your section's classes, report a clash, or ask for a change…" :
      "Ask about your timetable, request a change, or check availability…")
    : p?.to_requester ? "Answer the agent's question…" : "Ask a follow-up, or change what you asked…";
  const locked = !!chat && (!chat.mine || last?.busy || last?.status === "running" || (!!p && !p.to_requester));
  $("text").disabled = $("send").disabled = locked;
  // while the agent works on your message, Send becomes Stop
  const stoppable = !!chat?.mine && !!last?.can?.stop && (last.busy || last.status === "running");
  $("send").innerHTML = icon(stoppable ? "stop" : "send", 15);  // an icon, as the demo app's composer: send, or stop while it works
  $("send").setAttribute("aria-label", stoppable ? "Stop" : "Send");
  $("send").title = stoppable ? "Stop: nothing it does after this reaches the office" : "Send (Enter)";
  $("send").classList.toggle("stopping", stoppable);
  $("send").disabled = locked && !stoppable;
  $("send").onclick = stoppable ? () => stopRun(last.id) : send;
  if (!chat?.episodes && $("convSel")) {  // beside the timetable: a short start, the week is the main thing
    $("msgs").innerHTML = `<div class="welcome compact">
      <h3>New request</h3>
      <div class="sub">${me.role === "student" ? `Ask about ${esc(me.section)}'s classes, report a clash, or ask for a change. Click a class to
        ask about it. The agent looks things up and passes what needs a decision to the timetable office, which replies here.` :
        `Click one of your classes to cancel, move or swap it, or ask in your own words. Changes go to the
        timetable office for approval; the agent asks colleagues first if their classes are involved.`}</div>
      <p class="try-h">Try</p>
      <div class="tries">${(me.role === "student" ? REP_TRIES : ["When am I free on Monday?", "What do I teach this week?", "I'm away next Tuesday, cancel my classes that day"]).map((x) =>
        `<button class="try" data-try="${esc(x)}">${icon("arrow", 13)}<span>${esc(x)}</span></button>`).join("")}</div>
      ${inboxList.length ? `<div class="callout"><b>${inboxList.length} colleague${inboxList.length === 1 ? "" : "s"} asked you something.</b>
        <div class="small">Pick it under “Waiting for your answer” above.</div></div>` : ""}</div>`;
    for (const b of document.querySelectorAll("[data-try]")) b.onclick = () => { $("text").value = b.dataset.try; grow(); $("text").focus(); };
  } else if (!chat?.episodes) {  // the Requests page: a short start, as the demo app's empty conversation
    const office = me.role === "office";
    $("msgs").innerHTML = `<div class="welcome compact">
      <h3>${office ? "A request for the office" : "Write a request"}</h3>
      <div class="sub">${office ? "Ask about rooms, people and the rules, or make a change for the department: close a room, move a class." :
        me.role === "student" ? `For ${esc(me.section)}: a question about its classes, a clash, or a change you would like. The agent answers what it can look up and passes the rest to the timetable office.` :
        "In your own words: a question about your timetable, or a change. Each conversation remembers what was said in it, and changes go to the timetable office for approval."}</div>
      <p class="try-h">Try</p>
      <div class="tries">${(office ? ["Which rooms are free on Thursday at 2 pm?", "Who is free on Monday at 10 am?", "Room 101 is closed on Friday for maintenance."]
        : me.role === "student" ? REP_TRIES : ["When am I free on Monday?", "What do I teach this week?", "I'm away next Tuesday, cancel my classes that day"]).map((x) =>
        `<button class="try" data-try="${esc(x)}">${icon("arrow", 13)}<span>${esc(x)}</span></button>`).join("")}</div>
      ${!office && inboxList.length ? `<div class="callout"><b>${inboxList.length} colleague${inboxList.length === 1 ? "" : "s"} asked you something.</b>
        <div class="small">Open “Asked of you” on the left.</div></div>` : ""}</div>`;
    for (const b of document.querySelectorAll("[data-try]")) b.onclick = () => { $("text").value = b.dataset.try; grow(); $("text").focus(); };
  } else {
    const box = $("msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const open = new Set([...box.querySelectorAll("details.thinking[open]")].map((d) => d.closest("[data-ep-box]").dataset.epBox));
    box.innerHTML = chat.episodes.map((c) => `<div data-ep-box="${esc(c.id)}">${episodeHtml(c)}</div>`).join("");
    for (const d of box.querySelectorAll("details.thinking")) if (open.has(d.closest("[data-ep-box]").dataset.epBox)) d.open = true;
    if (atEnd) box.scrollTop = box.scrollHeight;
    for (const b of document.querySelectorAll("[data-a]")) b.onclick = () => answer(b.dataset.ep, b.dataset.a);
    for (const b of document.querySelectorAll("[data-pick]")) b.onclick = () => { $("text").value = b.dataset.pick; send(); };
    for (const b of document.querySelectorAll("[data-decide]")) b.onclick = () => decide(b.dataset.ep, b.dataset.decide);
  }
  for (const b of document.querySelectorAll("[data-act]")) b.onclick = () => act(b.dataset.act);
}

async function stopRun(eid) {
  $("send").disabled = true;
  try { await api(`/api/episodes/${eid}/stop`, {method: "POST"}); } catch (e) { $("sendErr").textContent = e.message; }
  if (chat) await openThread(chat.id);
}

async function answer(eid, kind) {
  const box = document.querySelector(`[data-answer="${eid}"]`), text = box?.value.trim() || "";
  if (kind === "said" && !text) { box.focus(); return; }
  try {
    await api(`/api/episodes/${eid}/reply`, {method: "POST", body: JSON.stringify({answer: kind, text})});
    await openThread(chat.id);
  } catch (e) { alert(e.message); }
}

async function decide(eid, what) {
  try {
    const note = document.querySelector(`[data-note="${eid}"]`)?.value || "";
    await api(`/api/episodes/${eid}/${what}`, {method: "POST", body: what === "reject" ? JSON.stringify({note}) : "{}"});
    await openThread(chat.id);
    dep = await api("/api/department"); meta();
  } catch (e) { alert(e.message); }
}

// -- the office's inbox: what reached it from teachers, one item each -----------------------------------------------
// A change sent for approval, or a request the agent passed on. Open one: approve, reject, or write to the teacher.

let officeOpen = null;  // the id of the request open in the office's inbox

// the demo app's Inbox (pages/Inbox.tsx): a page heading, the list in a card with tabs, the open item beside it
let officeTab = "needs";

function officeView() {
  $("app").innerHTML = `<main class="wide"><div class="page-head"><div><h1>Inbox</h1>
      <p>Changes teachers sent for approval, and requests the agent passed to the office. Approve, reject, write to the teacher, or undo an approved change.</p></div></div>
    <div class="inbox-grid">
      <div class="box inbox-list"><div class="inbox-tabs" id="oTabs"></div><div id="oList"></div></div>
      <div class="box inbox-item" id="oItem"></div>
    </div></main>`;
  refreshOffice();
}

const OTONE = {submitted: ["brand", "check"], escalated: ["warn", "alert"], approved: ["ok", "check"], rejected: ["bad", "x"], undone: ["muted", "undo"]};

async function refreshOffice() {
  if (!$("oList")) return;
  let items;
  try { items = await api("/api/office/requests"); } catch { return; }
  if (!$("oList")) return;
  const needs = items.filter((c) => c.needs_office), done = items.filter((c) => !c.needs_office);
  const tabs = [["needs", "Needs you", needs.length], ["done", "Done", done.length], ["all", "All", items.length]];
  $("oTabs").innerHTML = `<div class="filters">${tabs.map(([k, l, n]) => `<button data-otab="${k}" class="${officeTab === k ? "on" : ""}">${l}${n ? ` <span class="small">${n}</span>` : ""}</button>`).join("")}</div>`;
  const shown = officeTab === "needs" ? needs : officeTab === "done" ? done : items;
  const tag = (c) => (c.decision?.undone ? "undone" : c.decision ? (c.decision.approved ? "approved" : "rejected") : c.status);
  $("oList").innerHTML = shown.length ? shown.map((c) => {
    const [tone, ic] = OTONE[tag(c)] || ["muted", "mail"];
    const words = {submitted: "To approve", escalated: "Passed on", approved: "Approved", rejected: "Rejected", undone: "Undone"}[tag(c)] || label(tag(c));
    return `<button class="oi ${officeOpen === c.id ? "sel" : ""}" data-oid="${esc(c.id)}"><span class="oi-icon t-${tone}">${icon(ic, 15)}</span>
      <span class="grow"><span class="req">${esc(c.request)}</span>
      <span class="oi-meta"><b class="t-${tone}">${words}</b> · ${esc(c.actor)}${c.week ? ` · week ${c.week}` : ""}<span class="grow"></span>${c.needs_office ? `<span class="live warn"></span>` : ""}${esc(when(c.started).split(" · ")[0])}</span></span></button>`;
  }).join("") : `<div class="empty">${icon("inbox", 22)}<b>${officeTab === "needs" ? "Nothing waiting on you" : "Nothing here yet"}</b>
      <span>Changes teachers send for approval, and requests the agent can't settle on its own, arrive here.</span></div>`;
  railDot("inbox", needs.length);
  for (const b of document.querySelectorAll("[data-otab]")) b.onclick = () => { officeTab = b.dataset.otab; refreshOffice(); };
  for (const x of document.querySelectorAll("[data-oid]")) x.onclick = () => { officeOpen = x.dataset.oid; place(); refreshOffice(); };
  if (!officeOpen && needs.length) officeOpen = needs[0].id;
  drawOffice(items);
}

function drawOffice(items) {
  const c = items.find((x) => x.id === officeOpen);
  if (!c) {
    if ($("oItem").dataset.shown !== "none") $("oItem").innerHTML = `<div class="empty">${icon("mail", 22)}<b>${items.length ? "Select a request" : "No requests yet"}</b>
      <span>${items.length ? "Its wording, the agent's draft, and the teacher's week before and after the change open here." :
        "When a teacher's change is ready for approval, it opens here with their week before and after it."}</span></div>`;
    $("oItem").dataset.shown = "none";
    return;
  }
  if ($("oItem").dataset.shown === `${c.id}:${c.status}:${c.notes.length}`) return;  // keep a half-written message
  $("oItem").dataset.shown = `${c.id}:${c.status}:${c.notes.length}`;
  const steps = c.events.map(stepHtml).filter(Boolean);
  const what = c.status === "submitted" ? "asks for this change" : c.status === "escalated" ? "was passed to the office" : label(c.status);
  const decided = c.decision ? `<div class="callout ${c.decision.approved ? "ok" : ""}">${c.decision.approved ? "Approved" : "Rejected"}
    ${c.decision.note ? `: ${esc(c.decision.note)}` : ""}</div>` : "";
  $("oItem").innerHTML = `<div class="stack office-item">
      <div class="small">${esc(c.actor)} · week ${c.week ?? "–"} · ${esc(c.started.replace("T", " "))} · <span class="badge s-${esc(c.status)}">${label(c.status)}</span></div>
      <div class="quote">“${esc(c.request)}”</div>
      <div class="small">${esc(c.actor)} ${what}.</div>
      ${c.text || c.detail ? `<div><b>The agent:</b> ${esc(c.text || c.detail)}</div>` : ""}
      ${c.draft.length ? `<div><b>Proposed changes</b><ul>${c.draft.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${c.draft.length ? `<div id="oPreview" class="small">Loading the timetable before and after…</div>` : ""}
      ${c.status === "submitted" && c.draft.some((d) => /\bfrom week \d+\b(?!\s*to)|\bevery week\b/.test(d)) ? `<div class="callout">⚠️ This holds
        <b>until the end of term</b>, not for one week. Check that ${esc(c.actor)} asked for that before approving.</div>` : ""}
      ${c.stale && c.status === "submitted" ? `<div class="callout">The timetable changed since this was drafted, so it can't be approved as it is. Tell ${esc(c.actor)} to send it again.</div>` : ""}
      ${steps.length ? `<details class="thinking"><summary>How the agent got here · ${steps.length} steps</summary><ol>${steps.join("")}</ol></details>` : ""}
      ${c.notes.map((n) => `<div class="msg agent"><div class="bubble office">${esc(n.text)}<div class="small">the office · ${esc((n.at || "").slice(11, 16))}</div></div></div>`).join("")}
      ${decided}
      <textarea id="oNote" placeholder="A message to ${esc(c.actor)} (optional with Approve or Reject)"></textarea>
      <div class="row">
        ${c.can.decide && !c.stale ? `<button class="primary" id="oYes">Approve</button><button class="danger" id="oNo">Reject</button>` : ""}
        ${c.status === "approved" ? `<button class="danger" id="oUndo" title="Take this change back out of the timetable">Undo this change</button>` : ""}
        <button id="oSay">Send message only</button><span class="small" id="oErr"></span></div></div>`;
  const act = async (path, body) => {
    try { await api(`/api/episodes/${c.id}/${path}`, {method: "POST", body: JSON.stringify(body)}); $("oItem").dataset.shown = "";
      await refreshOffice(); dep = await api("/api/department"); meta();
    } catch (e) { $("oErr").textContent = e.message; }
  };
  if ($("oPreview")) beforeAfter(c.id);
  const note = () => $("oNote").value.trim();
  if ($("oYes")) $("oYes").onclick = () => act("approve", {note: note()});
  if ($("oNo")) $("oNo").onclick = () => act("reject", {note: note()});
  if ($("oUndo")) $("oUndo").onclick = () => confirm(`Undo this change for ${c.actor}? Their timetable goes back to how it was before it.`)
    && act("undo", {note: note()});
  $("oSay").onclick = () => note() ? act("note", {note: note()}) : $("oNote").focus();
}


// the requester's week before and after the change, side by side: what the office approves, not just its wording
async function beforeAfter(eid) {
  let p;
  try { p = await api(`/api/episodes/${eid}/preview`); } catch (e) { if ($("oPreview")) $("oPreview").textContent = e.message; return; }
  if (!$("oPreview")) return;
  const hours = dep.hours.slice(0, -1), wk = p.week ? `week ${p.week}` : "every week";
  const grid = (rows, title) => `<div class="mini-wrap"><div class="mini-title">${title}</div><div class="mini" style="--days:${dep.days.length}">
    <div></div>${dep.days.map((d) => `<div class="mh">${esc(d.slice(0, 3))}</div>`).join("")}
    ${hours.map((h) => `<div class="mh hr">${esc(h)}</div>${dep.days.map((d) => `<div class="mc ${h === dep.lunch ? "lunch" : ""}">${rows
      .filter((r) => r.day === d && r.from === h).map((r) => `<div class="mb ${r.change}" style="--c:${colorFor(r.course)}" title="${esc(`${r.course} (${r.kind}) · ${r.room}`)}">
        ${esc(r.course)}<span>${esc(r.room)}</span></div>`).join("")}</div>`).join("")}`).join("")}</div></div>`;
  const more = p.weeks.length > 1 ? ` The same change applies in ${p.weeks.length} weeks: ${p.weeks.map((w) => w ?? "semester").join(", ")}.` : "";
  $("oPreview").className = "preview";
  $("oPreview").innerHTML = `<b>${esc(p.teacher)}'s ${wk}, before and after</b><div class="small">Dashed: taken out. Green: where it goes.${esc(more)}</div>
    <div class="pv">${grid(p.before, "Before")}${grid(p.after, "After")}</div>
    ${p.others.length ? `<div class="small"><b>It also moves other people's classes:</b> ${p.others.map((o) =>
      `${esc(o.teacher)}'s ${esc(o.course)}: ${esc(o.was || "new")} → ${esc(o.now)}`).join("; ")}</div>` : ""}`;
}

// -- notifications: a bell in the header ---------------------------------------------------------------------------
// Your requests approved or not, the office's messages, and other people's approved changes that move your classes.

const ICON = {approved: "✅", rejected: "⛔", not_committed: "⚠️", office: "✉️", affected: "📅", undone: "↩️"};
const HEAD = {approved: "Approved", rejected: "Not approved", not_committed: "Not committed", office: "The office wrote",
  affected: "Your classes changed", undone: "Undone by the office"};
let told = [], toldNewest = null;  // the newest notice seen by this tab, so a newer one pops up once

const seenKey = () => `nts.seen.${me.dept}.${me.name}`;

async function refreshBell() {
  if (!$("bell")) return;
  try { told = await api("/api/notices"); } catch { return; }
  const seen = remember(seenKey()) || "";
  const fresh = told.filter((n) => n.at > seen).length;
  $("bellDot").textContent = fresh ? String(fresh) : "";
  $("bellDot").hidden = !fresh;
  const newest = told[0]?.at || "";
  if (toldNewest !== null && newest > toldNewest && newest > seen) toast(told[0]);
  toldNewest = newest;
  drawRepChanges();
  if (!$("bellPanel").hidden) drawBell();
}

function drawBell() {
  const seen = remember(seenKey()) || "";
  $("bellPanel").innerHTML = `<div class="row"><b>Notifications</b><button class="link" id="bellClose" style="margin-left:auto">Close</button></div>` +
    (told.length ? told.map((n, i) => `<div class="notice ${n.at > seen ? "new" : ""}" data-n="${i}">
      <div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b> <span class="small">· ${esc(n.at.slice(5, 16).replace("T", " "))}</span></div>
      ${n.mine ? `<div class="small">Your request: “${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div></div>`).join("")
      : `<div class="empty">Nothing yet. When the office decides on a request, or a change moves one of your classes, it shows up here.</div>`);
  $("bellClose").onclick = () => { $("bellPanel").hidden = true; };
  for (const x of document.querySelectorAll("[data-n]")) x.onclick = () => {
    const n = told[Number(x.dataset.n)];
    $("bellPanel").hidden = true;
    if (n.mine && me.role !== "office") openThread(n.thread);
    else if (n.kind === "affected") show(ownsWeek() ? "home" : "timetable");
  };
}

function toast(n) {  // a new notification, for a few seconds; a click opens the bell
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast panel";
  t.innerHTML = `<div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b></div>
    ${n.mine ? `<div class="small">“${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div>`;
  t.onclick = () => { t.remove(); toggleBell(); };
  document.body.append(t);
  setTimeout(() => t.remove(), 8000);
}

function toggleBell() {
  $("bellPanel").hidden = !$("bellPanel").hidden;
  if (!$("bellPanel").hidden) {
    drawBell();
    if (told.length) remember(seenKey(), told[0].at);  // newest first: all of these are seen now
    $("bellDot").hidden = true;
  }
}

// -- timetable: one grid for the teacher's home and the "This week" page ------------------------------------------
// Classes are coloured per course and can be clicked: your own to cancel, move or swap it, anyone's to ask about it.
// A click drafts the request in the composer; nothing is sent until you press Send.

let ttClasses = [];  // the classes on the grid shown, for the class menu

// a class as the demo app's TimetableGrid draws it: the course, then one line of who, where and for whom, less what
// every class in the view shares (hide: {teacher, room, groups})
function gridHtml(classes, mine = null, hide = {}) {
  ttClasses = classes;
  const detail = (c) => [!hide.teacher && c.teacher, !hide.room && c.room, !hide.groups && c.sections.join(", ")].filter(Boolean).join(" · ");
  const cell = (day, h) => classes.map((c, i) => [c, i]).filter(([c]) => c.day === day && c.from === h).map(([c, i]) =>
    `<button class="cls ${mine && c.teacher === mine ? "own" : ""} ${c.kind === "practical" ? "prac" : ""}" data-ci="${i}" style="--c:${colorFor(c.course)}"
      title="${esc(`${c.course} (${c.kind}) · ${c.teacher} · ${c.sections.join(", ")} · ${c.room}`)}"><b>${icon(c.kind === "practical" ? "flask" : "cap", 11)}${esc(c.course)}</b>
      <span class="cls-d">${esc(detail(c))}</span></button>`).join("");
  return `<table class="grid"><tr><th class="h"></th>${dep.days.map((d) => `<th>${esc(d)}</th>`).join("")}</tr>` +
    dep.hours.slice(0, -1).map((h) => `<tr><td class="h">${esc(h)}</td>${dep.days.map((d) => {
      const inside = cell(d, h);
      return `<td class="${h === dep.lunch ? "hatch" : ""}">${h === dep.lunch && !inside ? `<span class="lunch">Lunch</span>` : inside}</td>`;
    }).join("")}</tr>`).join("") + "</table>";
}

function bindClasses(box, week) {
  for (const b of box.querySelectorAll("[data-ci]")) b.onclick = (ev) => { ev.stopPropagation(); classMenu(ev, ttClasses[Number(b.dataset.ci)], week); };
}

function closeClassMenu() { document.querySelector(".class-menu")?.remove(); }

// what can be done with a class, in the requester's words: the demo app's ClassMenu (cancel, reschedule, swap)
function classMenu(ev, c, week) {
  closeClassMenu();
  const own = me.role === "teacher" && c.teacher === me.name;
  const what = `my ${c.course} ${c.kind} on ${c.day} at ${c.from}`;
  const opts = own ? [
      ["x", "Cancel it this week", `Not held in week ${week}`, `Please cancel ${what} in week ${week}.`],
      ["move", "Reschedule it", "The agent finds a free time and asks whoever is affected", `Please move ${what} in week ${week} to another time.`],
      ["swap", "Swap with a colleague", "Trade the slot with another teacher's class", `I'd like to swap ${what} in week ${week} with a colleague's class.`],
      ["search", `Free hours on ${c.day}`, "Your free hours that day", `When am I free on ${c.day} in week ${week}?`]]
    : [["search", "Ask about this class", "Who, where and for whom", `Tell me about the ${c.course} ${c.kind} on ${c.day} at ${c.from} in week ${week}: who teaches it, where and for which sections?`],
      ...(me.role === "student" && c.sections.includes(me.section) ? [
        ["alert", "Report a clash", "The agent checks it, then tells the office if it is real",
          `Our ${c.course} ${c.kind} on ${c.day} at ${c.from} in week ${week} clashes with another of our classes. Can you check?`],
        ["move", "Ask the office to move it", "Students can't change it; the office decides",
          `Could our ${c.course} ${c.kind} on ${c.day} at ${c.from} in week ${week} be moved to another time? `]] : []),
      ...(me.role === "teacher" ? [["swap", "Ask to swap with it", `${c.teacher} is asked first`, `Could I swap one of my classes in week ${week} with ${c.teacher}'s ${c.course} ${c.kind} on ${c.day} at ${c.from}?`]] : []),
      ...(me.role === "office" ? [["move", "Move this class", "Drafted by the agent, checked by the solver", `Move ${c.teacher}'s ${c.course} ${c.kind} on ${c.day} at ${c.from} in week ${week} to another time.`]] : [])];
  const m = document.createElement("div");
  m.className = "panel class-menu";
  m.innerHTML = `<div class="cm-head" style="--c:${colorFor(c.course)}"><b>${esc(c.course)}</b><span class="small">${esc(c.kind)} · ${esc(c.day)} ${esc(c.from)} · ${esc(c.room)}<br>
      ${esc(c.teacher)} · ${esc(c.sections.join(", "))}</span></div>
    ${opts.map(([i, t, line], k) => `<button class="menu-item" data-k="${k}">${icon(i, 15)}<span><b>${esc(t)}</b><span class="small">${esc(line)}</span></span></button>`).join("")}`;
  document.body.append(m);
  const r = m.getBoundingClientRect();
  m.style.left = `${Math.max(8, Math.min(ev.clientX + 4, innerWidth - r.width - 12))}px`;
  m.style.top = `${Math.max(8, Math.min(ev.clientY + 4, innerHeight - r.height - 12))}px`;
  for (const b of m.querySelectorAll("[data-k]")) b.onclick = () => { closeClassMenu(); compose(opts[Number(b.dataset.k)][3], week); };
  setTimeout(() => addEventListener("mousedown", function off(e) {
    if (!e.target.closest(".class-menu")) { closeClassMenu(); removeEventListener("mousedown", off); }
  }), 0);
}

let pendingText = null;  // a request drafted from a class while the composer is on another page
function compose(text, week) {
  if (week) remember("nts.week", String(week));
  if (!$("text")) { pendingText = text; chat = null; reqMode = "chat"; show(ownsWeek() ? "home" : "requests"); return; }
  newChat();
  if (week && $("week")) $("week").value = week;
  $("text").value = text; $("text").focus();
  grow();
}

function grow() {  // the message box grows with what is in it, up to a few lines
  const t = $("text");
  if (!t) return;
  t.style.height = "auto";
  t.style.height = `${Math.min(t.scrollHeight + 2, 160)}px`;
}

// the demo app's WeekStepper: ‹ Week 5 › and a strip of the term's weeks to jump to. The week the demo runs in is
// ringed, the shown one filled, past weeks dimmed, and a dot marks a week with changes of its own. ← and → step.
const NOW_WEEK = 5;
const WEEK_OWN = {};  // week -> whether it has a timetable of its own (filled in once, in the background)
let weekNav = null;  // the bar the arrow keys move: {week, go}
let ownLoading = false;

function weekBar(id, week, go) {
  const box = $(id);
  if (!box) return;
  weekNav = {week, go};
  box.innerHTML = `<div class="wk-step"><button class="wk-arrow" data-wk="${week - 1}" ${week <= 1 ? "disabled" : ""} title="Previous week (←)" aria-label="Previous week">${icon("left", 15)}</button>
      <span class="wk-now">Week ${week}${week === NOW_WEEK ? `<span>this week</span>` : ""}</span>
      <button class="wk-arrow" data-wk="${week + 1}" ${week >= dep.weeks ? "disabled" : ""} title="Next week (→)" aria-label="Next week">${icon("chevron", 15)}</button></div>
    <div class="wk-strip" role="group" aria-label="Weeks">${Array.from({length: dep.weeks}, (_, i) => i + 1).map((w) =>
      `<button data-wk="${w}" class="wk ${w === week ? "sel" : w === NOW_WEEK ? "now" : ""} ${w < NOW_WEEK && w !== week ? "past" : ""}"
        title="Week ${w}${w === NOW_WEEK ? " · this week" : ""}${WEEK_OWN[w] ? " · has changes of its own" : ""}">${w}${WEEK_OWN[w] ? `<i></i>` : ""}</button>`).join("")}</div>
    ${week !== NOW_WEEK ? `<button class="wk-today" data-wk="${NOW_WEEK}">This week</button>` : ""}`;
  for (const b of box.querySelectorAll("[data-wk]")) b.onclick = () => go(Number(b.dataset.wk));
  if (!ownLoading && !Object.keys(WEEK_OWN).length) {
    ownLoading = true;
    Promise.all(Array.from({length: dep.weeks}, (_, i) => api(`/api/timetable?week=${i + 1}&teacher=${encodeURIComponent(dep.teachers[0] || "")}`)
      .then((t) => { WEEK_OWN[i + 1] = !!t.own; }).catch(() => {}))).then(() => { if ($(id) && weekNav) weekBar(id, weekNav.week, weekNav.go); });
  }
}

addEventListener("keydown", (e) => {
  if (!weekNav || !$("wkBar") && !$("twBar")) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowLeft" && weekNav.week > 1) weekNav.go(weekNav.week - 1);
  if (e.key === "ArrowRight" && weekNav.week < dep.weeks) weekNav.go(weekNav.week + 1);
});

// -- fairness: the demo app's Fairness page. The concession Gini and how it moved, credit per teacher, the ledger --

function giniOf(xs) {  // 0: even, 1: one person carries it all
  const n = xs.length, total = xs.reduce((a, b) => a + b, 0);
  if (!n || !total) return 0;
  let s = 0;
  for (const a of xs) for (const b of xs) s += Math.abs(a - b);
  return s / (2 * n * n * (total / n));
}

async function fairnessView() {
  $("pane").classList.add("bare");
  const f = await api("/api/fairness");
  const names = f.teachers.map((t) => t.teacher), burden = Object.fromEntries(names.map((n) => [n, 0]));
  const series = f.concessions.map((c) => { burden[c.teacher] = (burden[c.teacher] || 0) + c.credit; return giniOf(Object.values(burden)); });
  const top = Math.max(...f.teachers.map((t) => t.burden), 0.0001);
  const spark = series.length > 1 ? (() => {
    const w = 520, h = 120, x = (i) => 8 + (i * (w - 16)) / (series.length - 1), y = (v) => h - 10 - v * (h - 20);
    const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" class="spark" role="img" aria-label="The Gini after each concession">
      <line x1="8" x2="${w - 8}" y1="${y(0)}" y2="${y(0)}" class="axis"/><line x1="8" x2="${w - 8}" y1="${y(1)}" y2="${y(1)}" class="axis"/>
      <polyline points="${pts}" class="line"/>${series.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" class="pt"><title>After concession ${i + 1}: ${v.toFixed(2)}</title></circle>`).join("")}</svg>`;
  })() : `<div class="empty">${series.length ? "One concession so far: the line starts with the next." : "No concessions yet: nobody has given way."}</div>`;
  $("pane").innerHTML = `<div class="fair-top">
      <div class="box"><div class="box-h"><div><h3>Concession Gini</h3><p>This term</p></div></div>
        <div class="big-stat"><b>${f.spread.gini.toFixed(2)}</b><span>0 is perfectly even, 1 is one person giving way every time</span>
          <div class="kv-row"><span>Concessions <b>${f.concessions.length}</b></span><span>Largest burden <b>${f.spread.max.toFixed(2)}</b></span>
          <span>Total credit <b>${(f.spread.total ?? 0).toFixed(2)}</b></span></div></div></div>
      <div class="box"><div class="box-h"><div><h3>How the Gini moved</h3><p>After each concession this term, in order. Lower is more even.</p></div></div>
        <div class="spark-wrap">${spark}</div></div>
    </div>
    <div class="box"><div class="box-h"><div><h3>Credit and concessions per teacher</h3>
      <p>A concession counts its rule's weight times how much was given up (some weeks: half; dropped: all). The agent asks first whoever has given way less.</p></div></div>
      <table class="data flush"><tr><th>Teacher</th><th class="n">Given way</th><th class="n">Credit</th><th style="width:34%"></th><th>For</th></tr>
      ${f.teachers.map((t) => `<tr><td><span class="who">${avatar(t.teacher, "sm")}${esc(t.teacher)}</span></td><td class="n">${t.given_way}</td>
        <td class="n">${t.burden.toFixed(2)}</td><td><div class="bar" style="width:${(100 * t.burden / top).toFixed(1)}%"></div></td>
        <td class="small">${esc(t.for.join(", ")) || "–"}</td></tr>`).join("")}</table></div>
    <div class="box"><div class="box-h"><div><h3>Ledger entries</h3><p>Append-only; recorded when a teacher agrees to waive a rule in a negotiation</p></div></div>
      ${f.concessions.length ? `<table class="data flush"><tr><th>#</th><th>Teacher</th><th>Gave way for</th><th class="n">Week</th><th class="n">Credit</th></tr>

async function rulesView() {

    <div class="box"><div class="box-h"><div><h3 id="rtitle">All rules</h3><p id="rcount"></p></div></div><div id="rlist"></div></div>`;
  let t = null;
  const mark = (s, q) => q ? esc(s).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").split(/\s+/).filter(Boolean).join("|")})`, "gi"), "<mark>$1</mark>") : esc(s);

async function overview(days) {
  $("oloading").textContent = "Reading the telemetry…";
  $("ofind").innerHTML = `<div class="box"><div class="empty">Reading the telemetry… (a few seconds over many episodes)</div></div>`;
  let o;
  try { o = await api(`/api/obs/overview?days=${days}`); } catch (e) { $("ofind").innerHTML = `<div class="callout">${esc(e.message)}</div>`; return; }
  if (!$("ofind")) return;
  $("oloading").textContent = "";
  const s = o.status, n = Math.max(o.episodes, 1), pct = (x) => `${Math.round((100 * x) / n)}%`;
  const failed = (s.model_error || 0) + (s.stuck || 0) + (s.budget_exhausted || 0);
  const calls = o.models.reduce((a, m) => a + (m.tool_calls || 0), 0), refused = o.models.reduce((a, m) => a + (m.refused || 0), 0);
  const judged = o.models.reduce((a, m) => a + (m.judged || 0), 0), passed = o.models.reduce((a, m) => a + (m.passed || 0), 0);
  // each finding: [level, title, what it means and what to do]
  const finds = [];
  if ((s.model_error || 0) / n > 0.05) finds.push(["fix", `The model failed on ${pct(s.model_error)} of requests`, `${s.model_error} requests ended with a model error. Check the model server is up and serves only the adapter in use (all of them overflow the GPU).`]);
  else if (s.model_error) finds.push(["look", `${s.model_error} model errors`, "A few requests hit a model error: usually the server restarting or busy. The harness retries; these did not recover."]);
  if (((s.stuck || 0) + (s.budget_exhausted || 0)) / n > 0.02) finds.push(["look", `${(s.stuck || 0) + (s.budget_exhausted || 0)} requests ran out of turns or got stuck`, "The agent repeated itself or kept being refused. Open them under Episodes to see which tool kept refusing."]);
  if (calls && refused / calls > 0.1) finds.push(["look", `${Math.round((100 * refused) / calls)}% of tool calls were refused`, "Refusals say what to do next, but many of them cost turns. The reasons are listed below."]);
  if ((s.declined || 0) + (s.escalated || 0)) finds.push(["know", `${pct((s.declined || 0) + (s.escalated || 0))} declined or passed to the office`, "Requests the rules forbid, or that need the office's authority. Not failures."]);
  if (judged) finds.push([passed / judged >= 0.85 ? "ok" : "look", `${passed} of ${judged} judged requests passed (${Math.round((100 * passed) / judged)}%)`, "From the scenario runs, where the outcome is checked against what should have happened."]);
  finds.push(["ok", `${pct((s.answered || 0) + (s.submitted || 0))} answered or sent for approval`, `${o.episodes.toLocaleString()} requests in this period.`]);
  const LEVEL = {fix: ["Fix now", "bad", "alert"], look: ["Look into", "warn", "search"], know: ["Good to know", "info", "mail"], ok: ["Working", "ok", "check"]};
  $("ofind").innerHTML = `<div class="find-grid">${["fix", "look", "know", "ok"].map((k) => {
      const list = finds.filter((f) => f[0] === k), [t, tone, ic] = LEVEL[k];
      return `<div class="box find t-${tone}"><div class="find-h">${icon(ic, 15)}<b>${t}</b><span class="small">${list.length}</span></div>
        ${list.map(([, title, text]) => `<div class="find-i"><b>${esc(title)}</b><p>${esc(text)}</p></div>`).join("") || `<div class="find-i"><p>Nothing.</p></div>`}</div>`;
    }).join("")}</div>`;
  const bars = (rows, tone = "brand") => { const top = Math.max(...rows.map((r) => r[1]), 1);
    return rows.map(([k, v, t]) => `<div class="hbar"><span class="grow">${esc(k)}</span><div class="hbar-b"><div class="bar t-${t || tone}" style="width:${(100 * v / top).toFixed(1)}%"></div></div><span class="n">${v.toLocaleString()}</span></div>`).join("")
      || `<div class="empty">None.</div>`; };
  const ended = Object.entries(s).sort((a, b) => b[1] - a[1]).map(([k, v]) => [ENDED[k]?.[0] || label(k), v, ENDED[k]?.[1]]);
  const perDay = (o.by_day || []).map((d) => [d.day.slice(5), Object.entries(d).filter(([k]) => k !== "day").reduce((a, [, v]) => a + v, 0)]);
  $("ocards").innerHTML = `<div class="dash-grid">
      <div class="col">
        <div class="box"><div class="box-h"><div><h3>Where requests ended up</h3><p>All ${o.episodes.toLocaleString()} requests, by how each one ended</p></div></div><div class="hbars">${bars(ended)}</div></div>
        <div class="box"><div class="box-h"><div><h3>Models</h3><p>What read the requests, how often it passed, and what it cost</p></div></div>
          <div class="scroll"><table class="data flush"><tr><th>Model</th><th class="n">Requests</th><th class="n">Passed</th><th class="n">Seconds each</th><th class="n">Tokens each</th><th class="n">Refused calls</th></tr>
          ${o.models.map((m) => `<tr><td>${esc(m.model)}</td><td class="n">${m.episodes}</td><td class="n">${m.judged ? `${Math.round(100 * m.passed / m.judged)}%` : "–"}</td>
            <td class="n">${(m.seconds / Math.max(m.episodes, 1)).toFixed(1)}</td><td class="n">${Math.round(m.tokens / Math.max(m.episodes, 1)).toLocaleString()}</td>
            <td class="n">${m.tool_calls ? `${Math.round(100 * m.refused / m.tool_calls)}%` : "–"}</td></tr>`).join("")}</table></div></div>
      </div>
      <div class="col">
        <div class="box"><div class="box-h"><div><h3>Requests per day</h3><p>How busy the agent was</p></div></div><div class="hbars">${bars(perDay.slice(-14))}</div></div>
        <div class="box"><div class="box-h"><div><h3>Tool calls</h3><p>What the agent reached for most</p></div></div><div class="hbars">${bars(o.tools.slice(0, 10).map(([k, v]) => [label(k), v]))}</div></div>
        <div class="box"><div class="box-h"><div><h3>Refused calls, by reason</h3><p>Each refusal names the next step; frequent ones cost turns</p></div></div><div class="hbars">${bars(o.errors.slice(0, 8).map(([k, v]) => [label(k), v, "warn"]))}</div></div>
      </div></div>`;
}

async function episodesTable() {
  const q = new URLSearchParams({limit: 100});
  if ($("ostatus").value) q.set("status", $("ostatus").value);
  if ($("overdict").value) q.set("verdict", $("overdict").value);
  if ($("omodel").value) q.set("model", $("omodel").value);
  const eps = await api(`/api/obs/episodes?${q}`);
  $("oeps").innerHTML = `<table class="data"><tr><th>When</th><th>Request</th><th>Model</th><th>Ended</th><th>Verdict</th><th class="n">Turns</th><th class="n">Refused</th><th class="n">Tokens</th></tr>
    ${eps.map((e) => `<tr class="click" data-trace="${esc(e.id)}"><td class="small">${esc(when(e.start))}</td><td>${esc(e.request)}${e.family ? ` <span class="small">${esc(e.family)}</span>` : ""}</td>
      <td class="small">${esc(e.model)}</td><td>${pill(e.status, ENDED[e.status]?.[0] || e.status)}</td>
      <td>${e.verdict ? pill(e.verdict) : ""}</td><td class="n">${e.turns}</td><td class="n">${e.refused}</td><td class="n">${e.tokens.toLocaleString()}</td></tr>`).join("")}</table>`;
  for (const tr of document.querySelectorAll("tr[data-trace]")) tr.onclick = () => trace(tr.dataset.trace);
}

async function trace(id) {
  const spans = await api(`/api/obs/trace/${id}`);
  const line = (s) => {
    const a = s.attrs;
    if (s.kind === "model_call") { const r = a.response || {}; return `${esc(r.text || "")} ${(r.tool_calls || []).map((c) => `<span class="call">${esc(c.name)}(${esc(args(c.arguments))})</span>`).join(" ")}`; }
    if (s.kind === "tool_call") return a.ok ? "ok" : `<span class="s-failed">${esc(a.result?.error?.code)}: ${esc(a.result?.error?.message)}</span>`;
    if (s.kind === "reply") return `“${esc(a.ask?.text)}” → ${esc(a.reply?.answer)} ${esc(a.reply?.text)}`;
    if (s.kind === "evaluation") return a.passed ? `<span class="s-passed">passed</span>` : `<span class="s-failed">failed: ${esc((a.failures || []).join("; "))}</span>`;
    if (s.kind === "episode" || s.kind === "resume") return `${label(a.status)} ${esc(a.text || a.detail || "")}`;
    if (s.kind === "approval") return a.committed ? "committed" : `not committed ${esc(a.note || a.reason || "")}`;
    return "";
  };
  $("otrace").innerHTML = `<div class="box" style="margin-top:12px"><div class="box-h"><div><h3>Trace ${esc(id)}</h3><p>Every model call and tool call, in order</p></div>
      <button class="link" id="tclose">Close</button></div>
    <div class="scroll"><table class="data flush"><tr><th>Span</th><th>Name</th><th class="n">ms</th><th>What</th></tr>${spans.filter((s) => s.kind !== "turn").map((s) =>
      `<tr><td class="small">${esc(s.kind)}</td><td>${esc(s.name)}</td><td class="n">${Math.round(s.ms)}</td><td>${line(s)}<details><summary>attributes</summary><pre>${esc(JSON.stringify(s.attrs, null, 1))}</pre></details></td></tr>`).join("")}</table></div></div>`;
  $("tclose").onclick = () => { $("otrace").innerHTML = ""; };
  $("otrace").scrollIntoView({behavior: "smooth"});
}

async function evals() {
  const r = await api("/api/obs/evals");
  $("oevals").innerHTML = `<table class="data"><tr><th>Report</th><th>Model</th><th>When</th><th class="n">Passed</th><th>Families</th></tr>
    ${r.map((x) => `<tr><td>${esc(x.report)}</td><td class="small">${esc(x.model)}</td><td class="small">${esc(x.when.replace("T", " "))}</td>
      <td class="n">${x.n ? `${x.passed}/${x.n}` : "–"}</td><td class="small">${Object.entries(x.families).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</td></tr>`).join("")}</table>`;
}


theme();
$("markSlot").innerHTML = MARK();
fold();
$("collapse").onclick = () => fold(!$("shell").classList.contains("folded"));
start().catch((e) => { $("app").innerHTML = `<div class="empty">Could not reach the API: ${esc(e.message)}</div>`; });
</script>
</body>
</html>

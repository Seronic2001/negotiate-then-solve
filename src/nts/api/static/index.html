<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable Office Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7fb; --panel: #ffffff; --panel-2: #f8fafc; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #dbeafe; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --soft: #eff4ff; --code: #f1f5f9; --bar: #2563eb; --user: #dbe6ff; --shadow: 0 10px 30px rgba(15, 23, 42, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --panel: #111827; --panel-2: #0f172a; --ink: #e5e7eb; --muted: #94a3b8; --line: #1f2a3d;
    --accent: #3b82f6; --accent-ink: #ffffff; --accent-soft: #172554; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171;
    --soft: #172036; --code: #0b1220; --bar: #3b82f6; --user: #1e3a6e; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --panel: #111827; --panel-2: #0f172a; --ink: #e5e7eb; --muted: #94a3b8; --line: #1f2a3d;
  --accent: #3b82f6; --accent-ink: #ffffff; --accent-soft: #172554; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171;
  --soft: #172036; --code: #0b1220; --bar: #3b82f6; --user: #1e3a6e; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }
.ic { flex: none; display: block; }

/* -- the top bar: brand, the sections, and the person ----------------------------------------------------------- */
header { display: flex; gap: 16px; align-items: center; height: 64px; padding: 0 20px; border-bottom: 1px solid var(--line);
  background: var(--panel-2); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; white-space: nowrap; }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; }
.shell { display: flex; min-height: calc(100vh - 64px); }
#app { flex: 1; min-width: 0; }
nav.rail { width: 84px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 12px 8px; border-right: 1px solid var(--line);
  background: var(--panel-2); position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; scrollbar-width: none; }
nav.rail button { position: relative; flex-direction: column; justify-content: center; gap: 5px; width: 100%; font-size: 11.5px; line-height: 1.2;
  text-align: center; padding: 10px 4px; }
nav.rail .ic { width: 20px; height: 20px; }
.rail-dot { position: absolute; top: 4px; right: 10px; }
.spacer { flex: 1; }
nav.rail:empty { display: none; }
header .grow-head { flex: 1; }
nav button { display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); padding: 8px 14px;
  border-radius: 10px; white-space: nowrap; }
nav button:hover { color: var(--ink); background: var(--soft); }
nav button.on { color: var(--ink); background: var(--accent-soft); }
nav button.on .ic { color: var(--accent); }
header .me { display: flex; gap: 6px; align-items: center; }
.iconbtn { border: 0; background: none; color: var(--muted); padding: 8px; border-radius: 10px; display: grid; place-items: center; }
.iconbtn:hover { color: var(--ink); background: var(--soft); }
.userbox, .bellbox { position: relative; }
.user { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 6px; border-radius: 12px; color: var(--ink); text-align: left; }
.user:hover { background: var(--soft); }
.user-text { display: flex; flex-direction: column; line-height: 1.25; }
.user-text .small { font-size: 12px; }
.menu { position: absolute; right: 0; top: 48px; width: 260px; z-index: 10; box-shadow: var(--shadow); }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 8px; border-radius: 8px; margin-top: 8px; }
.menu-item:hover { background: var(--soft); }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600;
  background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.avatar.sm { width: 30px; height: 30px; font-size: 13px; }
.avatar.bot { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.avatar.big { width: 56px; height: 56px; }

/* -- shared pieces ----------------------------------------------------------------------------------------------- */
select, input, textarea, button { font: inherit; color: inherit; }
select, input, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; outline: none; }
select:focus, input:focus, textarea:focus { border-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 64px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 20px; max-width: 1600px; margin: 0 auto; }
main.wide { grid-template-columns: 1fr; max-width: 1400px; }
.panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.small { font-size: 12.5px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; text-transform: capitalize; padding: 2px 10px; border-radius: 999px; white-space: nowrap;
  color: var(--muted); background: color-mix(in srgb, currentColor 14%, transparent); border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
.s-running, .s-submitted { color: var(--accent); } .s-waiting, .s-declined, .s-escalated { color: var(--warn); }
.s-approved, .s-answered, .s-passed { color: var(--ok); }
.s-rejected, .s-model_error, .s-budget_exhausted, .s-stuck, .s-not_committed, .s-failed { color: var(--bad); }
.s-replaced, .s-interrupted, .s-undone { color: var(--muted); }
.call { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; background: var(--code); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre { background: var(--code); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 300px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.callout { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--warn) 9%, transparent); }
.callout.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.empty { color: var(--muted); padding: 32px; text-align: center; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
table.data th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover { background: var(--soft); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; font-size: 12px; min-width: 640px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px; vertical-align: top; }
table.grid th { background: var(--panel-2); font-weight: 600; color: var(--muted); }
table.grid td.h { width: 64px; color: var(--muted); white-space: nowrap; }
.cls { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; }
.cls b { display: block; font-weight: 600; }
.scroll { overflow-x: auto; }
.dot { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 600; line-height: 17px; }
.bar { height: 8px; background: var(--bar); border-radius: 4px; min-width: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel-2); }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.login { max-width: 400px; margin: 10vh auto; }
.rule h3 { margin: 0 0 4px; font-size: 14px; }
.itile { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--ink); }

/* -- chat: the list of conversations, the conversation, and its details ---------------------------------------- */
main.chat { grid-template-columns: 300px minmax(0, 1fr) 320px; height: calc(100vh - 64px); max-width: none; }
main.chat.two { grid-template-columns: 320px minmax(0, 1fr); }
main.chat.closed { grid-template-columns: minmax(0, 1fr) 320px; }
main.chat.two.closed { grid-template-columns: minmax(0, 1fr); }
main.chat.closed .side { display: none; }
.side { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.side h2 { font-size: 12.5px; color: var(--muted); margin: 14px 4px 4px; font-weight: 500; }
.side .new { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; font-size: 15px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0 10px; color: var(--muted); }
.search input { border: 0; background: none; flex: 1; padding: 10px 0; color: var(--ink); }
kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
.list li:hover { background: var(--soft); }
.list li.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.list li.none { cursor: default; } .list li.none:hover { background: none; }
.list .req { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.li-icon { color: var(--muted); display: grid; place-items: center; }
.convo { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
.convo-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.convo-head .title { font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { flex: 1; overflow-y: auto; padding: 18px 22px; }
.msg { display: flex; gap: 12px; margin: 14px 0; align-items: flex-start; }
.msg .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 760px; }
.msg.user { justify-content: flex-end; }
.msg.user .col { align-items: flex-end; }
.msg .stamp { margin-top: -6px; }
.bubble { padding: 11px 16px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--user); border-color: transparent; border-top-right-radius: 6px; }
.msg.agent .bubble { border-top-left-radius: 6px; }
.bubble.ask { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.bubble.office { border-left: 3px solid var(--accent); }
.thinking { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
.thinking > summary { font-size: 13px; }
.thinking ol { margin: 6px 0 0; padding-left: 20px; }
.thinking li { margin: 4px 0; }
.thinking li.bad { color: var(--bad); }
.thinking li.note { color: var(--muted); font-style: italic; list-style: none; margin-left: -20px; }
.thinking li details { display: inline-block; margin-left: 6px; }
.result { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel-2); display: flex; flex-direction: column; gap: 12px; }
.result-head { display: flex; gap: 12px; align-items: center; }
.result-icon { display: grid; place-items: center; }
.result.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
.result.ok b, .result.ok .result-icon { color: var(--ok); }
.result.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); } .result.warn b, .result.warn .result-icon { color: var(--warn); }
.result.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); } .result.bad b, .result.bad .result-icon { color: var(--bad); }
.result.muted .result-icon { color: var(--muted); }
.changes { display: flex; flex-direction: column; gap: 6px; }
.change { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.composer { margin: 0 18px 18px; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--panel-2); }
.composer textarea { border: 0; background: none; min-height: 44px; padding: 6px 4px; resize: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 10px; padding: 4px 10px; background: var(--panel); }
.chip select { border: 0; padding: 0 2px; background: none; color: var(--ink); }
.send { margin-left: auto; width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.send:hover { filter: brightness(1.08); }
.welcome { text-align: center; padding: 8vh 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.welcome h3 { margin: 6px 0 0; font-size: 20px; font-weight: 600; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; justify-content: inherit; }
.welcome .picks { justify-content: center; }
.pick { border-radius: 999px; border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); padding: 5px 13px; background: none; }
.pick:hover { background: var(--accent-soft); }
.details { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 15px; }
.card-head .itile { width: 36px; height: 36px; }
.count { margin-left: auto; background: var(--soft); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; }
.details .change { margin-bottom: 8px; }
.action { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 8px; padding: 11px 12px; text-align: left; background: var(--panel-2); }
.action:hover { background: var(--soft); }
.office-item { max-width: 900px; margin: 0 auto; }

/* -- notifications ------------------------------------------------------------------------------------------------ */
.bell { position: relative; }
.bell .dot { position: absolute; top: 2px; right: 0; }
.bell-panel { position: absolute; right: 0; top: 48px; width: min(420px, 90vw); max-height: 70vh; overflow-y: auto; z-index: 10; box-shadow: var(--shadow); }
.toast { position: fixed; right: 20px; bottom: 20px; width: min(380px, 90vw); z-index: 20; cursor: pointer; border-left: 4px solid var(--accent); box-shadow: var(--shadow); }
.notice { padding: 10px; border-radius: 10px; cursor: pointer; border-top: 1px solid var(--line); }
.notice:hover { background: var(--soft); }
.notice.new { border-left: 3px solid var(--accent); }

/* scroll bars only while the pointer is over what scrolls */
.msgs, .side, .details { scrollbar-width: thin; scrollbar-color: transparent transparent; }
.msgs:hover, .side:hover, .details:hover { scrollbar-color: var(--line) transparent; }
.msgs::-webkit-scrollbar, .side::-webkit-scrollbar, .details::-webkit-scrollbar { width: 8px; }
.msgs::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb, .details::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
.msgs:hover::-webkit-scrollbar-thumb, .side:hover::-webkit-scrollbar-thumb, .details:hover::-webkit-scrollbar-thumb { background: var(--line); }

@media (max-width: 1250px) { main.chat, main.chat.closed { grid-template-columns: 280px minmax(0, 1fr); } main.chat.closed { grid-template-columns: minmax(0, 1fr); } .details { display: none; } }
@media (max-width: 860px) {
  nav.rail { width: 56px; } nav.rail button span:not(.dot) { display: none; }
  header { padding: 0 12px; gap: 8px; } .brand > span:not(.logo), .user-text { display: none; }
  main, main.chat, main.chat.two { grid-template-columns: 1fr; padding: 12px 16px; height: auto; }
  .side { max-height: 40vh; } .msgs { max-height: 65vh; }
}

/* -- the second design: neutral near-black, sections in one group at the top, a centred conversation ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f11; --panel: #17171a; --panel-2: #131315; --ink: #ececf0; --muted: #9b9ba5; --line: #27272c;
    --accent: #5b9cff; --accent-soft: #1a2a45; --soft: #1e1e23; --code: #0c0c0e; --user: #1f2b45; --bar: #5b9cff;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f11; --panel: #17171a; --panel-2: #131315; --ink: #ececf0; --muted: #9b9ba5; --line: #27272c;
  --accent: #5b9cff; --accent-soft: #1a2a45; --soft: #1e1e23; --code: #0c0c0e; --user: #1f2b45; --bar: #5b9cff;
}
header { height: 56px; background: var(--bg); }
.brand { font-size: 15px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; }
nav.seg { flex: none; display: flex; gap: 2px; padding: 4px; margin: 0 auto; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); }  /* not a scroll box: it would clip the More menu; narrow screens drop the labels instead */
nav.seg button { position: relative; padding: 6px 12px; font-size: 13.5px; border-radius: 8px; gap: 7px; }
nav.seg .rail-dot { position: absolute; top: -3px; right: -3px; }
.morebox { position: relative; }
.menu.more { width: 210px; top: 42px; }
.menu.more .menu-item { margin-top: 2px; }
.user .avatar { width: 32px; height: 32px; }
main.chat, main.chat.two { grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 56px); padding: 0; gap: 0; max-width: none; }
main.chat.closed, main.chat.two.closed { grid-template-columns: minmax(0, 1fr); }
.side { padding: 14px; border-right: 1px solid var(--line); gap: 8px; }
.side h2 { text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; margin: 12px 6px 2px; display: flex; justify-content: space-between; }
.new-req { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel); font-weight: 600; }
.new-req span { flex: 1; text-align: left; }
.search { border-radius: 10px; background: var(--panel); }
.search input { padding: 8px 0; }
.filters { display: flex; gap: 2px; flex-wrap: nowrap; padding: 2px 0; }
kbd { white-space: nowrap; flex: none; }
/* the browser draws a select's list itself: tell it the theme, so the options are not pale text on white */
:root { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
option { background: var(--panel); color: var(--ink); }
.filters button { border: 0; background: none; color: var(--muted); padding: 4px 9px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
.filters button:hover { color: var(--ink); }
.filters button.on { background: var(--soft); color: var(--ink); }
.list li { padding: 9px 10px; border-radius: 10px; }
.list li.sel { background: var(--soft); border-color: transparent; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: currentColor; color: var(--muted); align-self: flex-start; margin-top: 7px; }
.sdot.s-approved, .sdot.s-answered { color: var(--ok); } .sdot.s-running, .sdot.s-submitted { color: var(--accent); }
.sdot.s-waiting, .sdot.s-declined, .sdot.s-escalated { color: var(--warn); }
.sdot.s-rejected, .sdot.s-stuck, .sdot.s-model_error, .sdot.s-not_committed, .sdot.s-budget_exhausted { color: var(--bad); }
.list li .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo { border: 0; border-radius: 0; background: var(--bg); }
.convo-head { padding: 8px 16px; gap: 10px; min-height: 52px; }
.head-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.head-text b { overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; }
.head-text .small { overflow: hidden; text-overflow: ellipsis; }
.head-text .small::before { content: "· "; }
.head-acts { display: flex; gap: 8px; }
.ghost { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 13px; border-radius: 9px; background: none;
  color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ghost:hover { background: var(--accent-soft); }
.msgs { padding: 22px max(20px, calc((100% - 820px) / 2)); }
.composer { width: min(820px, calc(100% - 40px)); margin: 0 auto 20px; border-radius: 16px; background: var(--panel); }
.send { width: 34px; height: 34px; border-radius: 50%; padding: 0; }  /* a button's padding pushed the arrow off centre */
.send:disabled { background: var(--soft); color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px 10px; cursor: pointer; }
.switch input { display: none; }
.switch .track { width: 28px; height: 16px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(12px); background: #fff; }
.welcome { padding: 9vh 0 24px; gap: 12px; }
.welcome .spark { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--panel);
  border: 1px solid var(--line); color: var(--accent); }
.welcome h3 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
.welcome .sub { color: var(--muted); max-width: 520px; font-size: 15px; }
.welcome .pick { color: var(--ink); border-color: var(--line); background: var(--panel); padding: 8px 16px; font-weight: 500; }
.welcome .pick:hover { border-color: var(--muted); background: var(--soft); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; margin-top: 18px; }
.acard { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border-radius: 12px; background: var(--panel); }
.acard:hover { border-color: var(--muted); }
.acard-top { display: flex; justify-content: space-between; color: var(--accent); margin-bottom: 8px; }
.acard-top .ic:last-child { color: var(--muted); }
.acard b { font-size: 14.5px; }
@media (max-width: 1150px) { nav.seg button span:not(.dot) { display: none; } .head-acts .ghost { font-size: 0; gap: 0; } }
@media (max-width: 860px) {
  main.chat, main.chat.two { grid-template-columns: 1fr; height: auto; } .cards { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* -- the third look: warm neutrals, one deep green, square corners, text tabs; the same layout ------------------- */
:root {
  --bg: #f6f5f1; --panel: #fffefb; --panel-2: #f1efe9; --ink: #1d1c1a; --muted: #6f6b63; --line: #e4e1d8;
  --accent: #2d6a57; --accent-ink: #ffffff; --accent-soft: #e1ece6; --ok: #2f7a4b; --warn: #a8661b; --bad: #b3402f;
  --soft: #eeebe4; --code: #f1efe9; --bar: #2d6a57; --user: #ebe8e0; --shadow: 0 6px 20px rgba(40, 35, 25, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151513; --panel: #1c1b19; --panel-2: #191816; --ink: #ebe9e3; --muted: #9c978c; --line: #2d2b27;
    --accent: #7fbfa6; --accent-ink: #10201a; --accent-soft: #22332c; --ok: #79b98c; --warn: #d8a25a; --bad: #e0806f;
    --soft: #24231f; --code: #131210; --bar: #7fbfa6; --user: #26241f; --shadow: 0 6px 20px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg: #151513; --panel: #1c1b19; --panel-2: #191816; --ink: #ebe9e3; --muted: #9c978c; --line: #2d2b27;
  --accent: #7fbfa6; --accent-ink: #10201a; --accent-soft: #22332c; --ok: #79b98c; --warn: #d8a25a; --bad: #e0806f;
  --soft: #24231f; --code: #131210; --bar: #7fbfa6; --user: #26241f; --shadow: 0 6px 20px rgba(0, 0, 0, .4);
}
[hidden] { display: none !important; }
body { font: 14px/1.5 "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
kbd, .call, pre { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
button, select, input, textarea, .search, .chip, .switch, .list li, .filters button, .new-req, .iconbtn, .menu-item, .notice, .ghost { border-radius: 6px; }
.panel, .card, .result, .callout, .composer, .bubble, .change, .tile, .menu, .bell-panel, .toast, .acard { border-radius: 8px; }

header { height: 52px; gap: 0; background: var(--bg); }
.brand { gap: 8px; font-weight: 600; font-size: 15px; margin-right: 28px; }
.brand .mark { color: var(--accent); display: grid; }
.brand .dept { color: var(--muted); font-weight: 400; }
nav.seg { margin: 0; padding: 0; border: 0; background: none; gap: 2px; align-self: stretch; }
nav.seg button { padding: 0 10px; border-radius: 0; color: var(--muted); font-size: 14px; }
nav.seg button:hover { background: none; color: var(--ink); }
nav.seg button.on { background: none; color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
nav.seg .morebox { display: flex; align-self: stretch; }
header .me { margin-left: auto; }
.user-text .small { display: none; }
.user .avatar, .avatar { width: 28px; height: 28px; font-size: 12.5px; background: var(--panel-2); }
.dot { font-size: 10.5px; line-height: 15px; padding: 0 5px; }
main.chat, main.chat.two { height: calc(100vh - 52px); }
.convo-head .itile { display: none; }

.new-req { font-weight: 500; }
.list li { align-items: flex-start; padding: 8px; }
.list li .sdot { display: none; }
.list .req { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 400; line-height: 1.4; }
.list .req::first-letter { text-transform: uppercase; }
.list li .badge { background: none; border: 0; padding: 0; font-size: 12px; text-transform: none; margin-top: 1px; }
.list li.sel { background: var(--soft); }
.ghost { color: var(--ink); border-color: var(--line); background: var(--panel); }
.ghost:hover { background: var(--soft); }

.msg .avatar { display: none; }
.msg.agent .bubble { background: none; border: 0; padding: 0; }
.msg.user .bubble { padding: 8px 14px; border-radius: 8px; }
.thinking { border-left-width: 1px; }
.result { padding: 12px 14px; gap: 10px; }
.change { padding: 7px 10px; border-radius: 4px; }
.composer { padding: 8px 10px; }
.send { width: auto; height: 30px; border-radius: 6px; padding: 0 14px; font-weight: 500; font-size: 13px; }
.switch { border: 0; padding: 4px 2px; }
.pick, .welcome .pick { border-radius: 6px; color: var(--ink); border-color: var(--line); background: var(--panel); }
.pick:hover { background: var(--soft); }

/* the empty chat: a plain heading and things to try, left-aligned like a page, not a centred splash */
.welcome { text-align: left; align-items: flex-start; padding: 7vh 0 24px; gap: 8px; }
.welcome h3 { font-size: 24px; font-weight: 600; }
.welcome .sub { font-size: 14px; }
.welcome .picks { justify-content: flex-start; }
.acard { padding: 12px 14px; }
.acard-top { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="currentColor">
    <rect x="1" y="1" width="7" height="4" rx="1"/><rect x="10" y="1" width="7" height="7" rx="1"/><rect x="1" y="7" width="7" height="10" rx="1"/>
    <rect x="10" y="10" width="7" height="7" rx="1" opacity=".45"/></svg></span>
    <span>Timetable</span><span class="dept" id="deptName"></span></div>
  <nav id="nav" class="seg" aria-label="Sections"></nav>
  <div class="me" id="who"></div>
</header>
<div id="app"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const label = (s) => esc(String(s ?? "").replaceAll("_", " "));
let me = null, dep = null, source = null, view = "requests", timer = null;

function remember(key, value) {
  try { if (value !== undefined) localStorage.setItem(key, value); return localStorage.getItem(key); } catch { return null; }
}

// Each browser tab keeps its own session (sessionStorage), so one tab can be a teacher and another the office.
function tabToken(value) {
  try { if (value !== undefined) value ? sessionStorage.setItem("nts.token", value) : sessionStorage.removeItem("nts.token");
    return sessionStorage.getItem("nts.token"); } catch { return null; }
}

async function api(path, opts = {}) {
  const auth = tabToken() ? {Authorization: `Bearer ${tabToken()}`} : {};
  const r = await fetch(path, {headers: {"Content-Type": "application/json", ...auth}, credentials: "same-origin", ...opts});
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; showLogin(); }
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : (body.detail?.message || r.statusText));
  return body;
}

// -- signing in ------------------------------------------------------------------------

async function start() {
  try { me = tabToken() ? await api("/api/me") : null; } catch { me = null; }
  me ? enter() : showLogin();
}

async function showLogin() {
  clearInterval(timer);
  $("who").innerHTML = ""; $("nav").innerHTML = ""; $("deptName").textContent = "";
  const d = await api("/api/departments");
  $("app").innerHTML = `<div class="panel login stack"><h2>Sign in</h2>
    <label class="small" for="ldept">Department</label>
    <select id="ldept">${d.departments.map((x) => `<option value="${esc(x.id)}">${esc(x.id)} (${x.faculty} teachers)</option>`).join("")}</select>
    <label class="small" for="lname">You are</label><select id="lname"></select>
    <input id="lclub" placeholder="The club's name" hidden>
    ${d.passwords ? `<label class="small" for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password">` :
      `<div class="small">This server signs people in by name alone: fine on your own machine, not on a network.</div>`}
    <button class="primary" id="lgo">Sign in</button><div class="small" id="lerr"></div></div>`;
  const fill = () => {
    const x = d.departments.find((y) => y.id === $("ldept").value);
    $("lname").innerHTML = [`<option value="office">The timetable office</option>`, ...x.teachers.map((t) => `<option>${esc(t)}</option>`),
      `<option value="club">A club…</option>`].join("");
    if (remember("nts.name")) $("lname").value = remember("nts.name");
    if (!$("lname").value) $("lname").value = "office";
    $("lclub").hidden = $("lname").value !== "club";
  };
  $("lname").onchange = () => { $("lclub").hidden = $("lname").value !== "club"; };
  $("ldept").onchange = fill;
  if (remember("nts.dept") && d.departments.some((x) => x.id === remember("nts.dept"))) $("ldept").value = remember("nts.dept");
  fill();
  const go = async () => {
    try {
      const name = $("lname").value === "club" ? `club: ${$("lclub").value.trim()}` : $("lname").value;
      const s = await api("/api/login", {method: "POST", body: JSON.stringify({dept: $("ldept").value, name, password: $("lpass")?.value || ""})});
      tabToken(s.token);
      remember("nts.dept", $("ldept").value); remember("nts.name", $("lname").value);
      me = await api("/api/me"); enter();
    } catch (e) { $("lerr").textContent = e.message; }
  };
  $("lgo").onclick = go;
  if ($("lpass")) $("lpass").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

// -- icons (lucide-style line icons, drawn in the current text colour) -------------------------------------------

const PATHS = {
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  booking: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  chart: '<path d="M3 3v18h18"/><path d="M8 17V9M13 17V5M18 17v-3"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  panel: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  bot: '<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  x: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
  dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  sparkle: '<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/><path d="M19 3v4M17 5h4"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  away: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/>',
  door: '<path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9M10 12v.01"/><path d="M13 4.56v16.157a.5.5 0 0 1-.622.485l-7-1.75A.5.5 0 0 1 5 19V5.562a.5.5 0 0 1 .379-.485l7-1.75A.5.5 0 0 1 13 3.81z"/>',
};
const icon = (name, size = 18) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name] || ""}</svg>`;
const initial = (name) => esc(String(name || "?").replace(/^(dr|prof|mr|mrs|ms)\.?\s+/i, "").trim().charAt(0).toUpperCase() || "?");
const when = (iso) => {  // "Oct 31 · 18:23"
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.toLocaleDateString(undefined, {month: "short", day: "numeric"})} · ${iso.slice(11, 16)}`;
};
const pill = (status, text) => `<span class="badge s-${esc(status)}">${label(text || status)}</span>`;

// -- light or dark, remembered per browser --------------------------------------------------------------------

function theme(set) {
  const now = set || remember("nts.theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  if (set) remember("nts.theme", set);
  document.documentElement.dataset.theme = now;
  if ($("themeBtn")) $("themeBtn").innerHTML = icon(now === "dark" ? "moon" : "sun", 20);
  return now;
}

async function enter() {
  dep = await api("/api/department");
  $("deptName").textContent = `/ ${me.dept}`;
  $("who").innerHTML = `
    <button class="iconbtn" id="themeBtn" title="Light or dark" aria-label="Light or dark"></button>
    ${me.role === "club" ? "" : `<span class="bellbox"><button class="iconbtn bell" id="bell" title="Notifications" aria-label="Notifications">${icon("bell", 20)}
      <span class="dot" id="bellDot" hidden></span></button><div class="panel bell-panel" id="bellPanel" hidden></div></span>`}
    <span class="userbox"><button class="user" id="userBtn" aria-haspopup="true"><span class="avatar">${initial(me.name)}</span>
      <span class="user-text"><b>${esc(me.name)}</b><span class="small">${esc(me.role)} · ${esc(me.dept)}</span></span>${icon("down", 16)}</button>
      <div class="panel menu" id="userMenu" hidden><div class="small" id="meta"></div>
        <button class="menu-item" id="logout">${icon("out", 16)} Sign out</button></div></span>`;
  theme();
  meta();
  $("themeBtn").onclick = () => theme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  $("userBtn").onclick = (e) => { e.stopPropagation(); $("userMenu").hidden = !$("userMenu").hidden; };
  document.onclick = (e) => {
    if ($("userMenu") && !e.target.closest(".userbox")) $("userMenu").hidden = true;
    if ($("bellPanel") && !e.target.closest(".bellbox")) $("bellPanel").hidden = true;
    if ($("moreMenu") && !e.target.closest(".morebox")) $("moreMenu").hidden = true;
  };
  if ($("bell")) { $("bell").onclick = (e) => { e.stopPropagation(); toggleBell(); }; refreshBell(); }
  $("logout").onclick = async () => { await api("/api/logout", {method: "POST"}); tabToken(""); me = null; chat = null; showLogin(); };
  show(view);
  clearInterval(timer); timer = setInterval(() => {
    if (view === chatTab()) { refreshLists(); freshen(); }
    if (view === "requests" && me.role === "office") refreshOffice();
    refreshBell();
  }, 4000);
}

function railDot(tab, n) {  // a count on a section of the rail: what waits for you there
  const d = document.querySelector(`[data-dot="${tab}"]`);
  if (d) { d.textContent = n ? String(n) : ""; d.hidden = !n; }
}

function meta() { if ($("meta")) $("meta").textContent = `${dep.model} · ${dep.agent} · version ${dep.version.slice(0, 8)}`; }

function show(which) {
  view = which;
  if (me.role === "club" && which === "requests") which = view = "bookings";
  const tabs = [...(me.role === "club" ? [] : [["requests", me.role === "office" ? "Inbox" : "Requests", me.role === "office" ? "inbox" : "chat"]]),
    ...(me.role === "office" ? [["chat", "Agent chat", "chat"]] : []),
    ["timetable", "Timetable", "calendar"], ["bookings", "Bookings", "booking"], ["fairness", "Fairness", "chart"], ["rules", "Rules", "file"]];
  const more = me.role === "office" ? [["semester", "Semester", "layers"], ["obs", "Observability", "activity"]] : [];
  $("nav").innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === which ? "on" : ""}" title="${l}"><span>${l}</span>
      <span class="dot rail-dot" data-dot="${k}" hidden></span></button>`).join("")
    + (more.length ? `<span class="morebox"><button id="moreBtn" class="${more.some(([k]) => k === which) ? "on" : ""}" title="More"><span>More</span></button>
      <div class="panel menu more" id="moreMenu" hidden>${more.map(([k, l, i]) => `<button class="menu-item" data-tab="${k}">${icon(i, 16)} ${l}</button>`).join("")}</div></span>` : "");
  if ($("moreBtn")) $("moreBtn").onclick = (e) => { e.stopPropagation(); $("moreMenu").hidden = !$("moreMenu").hidden; };
  if (which === "requests" && me.role === "office") officeView();
  else if (which === chatTab()) requestsView();
  else { $("app").innerHTML = `<main class="wide"><div id="pane" class="panel stack"></div></main>`;
    ({timetable: timetableView, bookings: bookingsView, fairness: fairnessView, rules: rulesView, semester: semesterView,
      obs: obsView})[which](); }
  for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => show(b.dataset.tab);
}

// -- chat: conversations (threads) of requests ------------------------------------------------------------
// Each message is one agent episode; a thread is a conversation of them, and the agent remembers the earlier
// messages of the thread. Its steps fold into "Thinking", open while it works.

const STEP = {
  find: "Looked up a name", describe: "Read the details", classes_of: "Checked the classes", free_hours: "Checked free hours",
  who_is_free: "Checked who is free", free_rooms: "Checked free rooms", changes: "Checked recent changes", rules: "Searched the regulations",
  constrain: "Drafted a rule", move_class: "Drafted a move", retract: "Took back part of the draft", list_draft: "Read the draft",
  swap_classes: "Drafted a swap", cancel_class: "Drafted a cancellation", add_class: "Drafted an extra class",
  limit_hours: "Drafted an hours limit", book_room: "Drafted a room booking", move_to_window: "Drafted a move to a time window",
  limit_load: "Drafted a load limit", relate_classes: "Drafted how classes relate", choose: "Drafted a choice between options",
  set_weeks: "Set the weeks", check_draft: "Checked the draft with the solver", submit: "Sent the draft to the office",
  decline: "Declined", escalate: "Passed it to the office",
};
let chat = null;  // the open conversation: {id, mine, episodes: [...]}, or null for a new one
let threadList = [];  // the sidebar's conversations, for the search box
const chatTab = () => (me.role === "office" ? "chat" : "requests");

async function freshen() {  // the office may decide or write while a chat is open: fetch it again when idle
  if (!chat?.episodes || chat.episodes.some((e) => e.busy || e.status === "running")) return;
  try {
    const now = await api(`/api/threads/${chat.id}`);
    if (chat?.id === now.id && JSON.stringify(now) !== JSON.stringify(chat)) { chat = now; draw(); }
  } catch { /* gone, or the server is restarting */ }
}

function sideToggle() {  // the side bar folds away, as in a chat app; the choice is remembered
  const main = document.querySelector("main.chat");
  main.classList.toggle("closed", remember("nts.side") === "closed");
  for (const b of document.querySelectorAll(".side-btn")) b.onclick = () => remember("nts.side", main.classList.toggle("closed") ? "closed" : "open");
}

let filter = "all";  // the sidebar's status chips
const FILTERS = [["all", "All"], ["approved", "Approved"], ["declined", "Declined"], ["answered", "Answered"]];
const FILTERED = {approved: ["approved"], declined: ["declined", "rejected", "stuck", "not_committed"], answered: ["answered"]};

// what each person can do in one click: [action, icon, title, line]
const CARDS = () => me.role === "office"
  ? [["inbox", "inbox", "Open the inbox", "Changes waiting for approval"], ["rooms", "search", "Find a free room", "Rooms free at a time you pick"],
     ["closure", "door", "Close a room", "Maintenance, an event, an exam"]]
  : [["timetable", "calendar", "View my timetable", "This week's classes and rooms"], ["free", "search", "Find free slots", "Your free hours this week"],
     ["absence", "away", "Report an absence", "Cancel or move a day's classes"]];

function requestsView() {
  $("app").innerHTML = `<main class="chat two">
    <aside class="side">
      <button class="new-req" id="newChat">${icon("plus", 16)}<span>New request</span><kbd>N</kbd></button>
      <label class="search">${icon("search", 16)}<input id="find" placeholder="Search conversations…" aria-label="Search conversations"><kbd>Ctrl+K</kbd></label>
      <div class="filters">${FILTERS.map(([k, l]) => `<button data-filter="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <section id="inboxBox" hidden><h2>Waiting for you</h2><ul class="list" id="inbox"></ul></section>
      <h2 class="recent">Recent <span id="recentN"></span></h2><ul class="list" id="threads"></ul>
    </aside>
    <section class="convo">
      <div class="convo-head"><button class="iconbtn side-btn" title="Show or hide the side bar" aria-label="Show or hide the side bar">${icon("panel")}</button>
        <div class="grow head-text"><b id="chatTitle">New chat</b><span class="small" id="chatSub"></span></div>
        <div class="head-acts">${CARDS().slice(0, 2).map(([a, i, t]) => `<button class="ghost" data-act="${a}">${icon(i, 16)} ${t}</button>`).join("")}</div></div>
      <div id="msgs" class="msgs"></div>
      <div class="composer">
        <textarea id="text" rows="2"></textarea>
        <div class="row"><label class="chip" title="The week the request is about">Week <select id="week" aria-label="Week">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select></label>
          <label class="switch" title="Simple stand-ins answer the agent's questions to other teachers"><input type="checkbox" id="simulate"><span class="track"></span>Stand-ins answer</label>
          <span class="small" id="sendErr"></span><button class="send primary" id="send">Send</button></div>
      </div>
    </section></main>`;
  $("week").value = remember("nts.week") || 5;
  $("week").onchange = () => remember("nts.week", $("week").value);
  $("simulate").checked = dep.simulate;
  $("send").onclick = send;
  sideToggle();
  $("newChat").onclick = newChat;
  $("find").oninput = drawThreads;
  for (const b of document.querySelectorAll("[data-filter]")) b.onclick = () => {
    filter = b.dataset.filter;
    for (const x of document.querySelectorAll("[data-filter]")) x.classList.toggle("on", x === b);
    drawThreads();
  };
  document.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && $("find")) { e.preventDefault(); $("find").focus(); }
    else if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && $("newChat")
             && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) { e.preventDefault(); newChat(); }
  };
  $("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  refreshLists();
  if (chat) openThread(chat.id); else draw();
}

function newChat() { chat = null; if (source) source.close(); draw(); drawThreads(); $("text").focus(); }

async function send() {
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true; $("sendErr").textContent = "";
  try {
    const ep = await api("/api/episodes", {method: "POST", body: JSON.stringify({request: text, week: Number($("week").value),
      simulate: $("simulate").checked, thread: chat?.mine ? chat.id : null})});
    $("text").value = "";
    await openThread(ep.thread);
  } catch (e) { $("sendErr").textContent = e.message; $("send").disabled = false; }
}

async function refreshLists() {
  if (!$("threads")) return;
  try {
    const [ts, inbox] = await Promise.all([api("/api/threads"), api("/api/inbox")]);
    threadList = ts;
    drawThreads();
    $("inboxBox").hidden = !inbox.length;
    $("inbox").innerHTML = inbox.map((e) => `<li data-thread="${esc(e.thread)}"><span class="li-icon">${icon("mail")}</span>
      <div class="grow"><div class="req">${esc(e.pending?.text || e.request)}</div><div class="small">from ${esc(e.actor)}</div></div></li>`).join("");
    railDot(chatTab(), inbox.length);
    for (const li of document.querySelectorAll("#inbox li[data-thread]")) li.onclick = () => openThread(li.dataset.thread);
  } catch { /* the server may be restarting */ }
}

function drawThreads() {
  if (!$("threads")) return;
  const q = ($("find")?.value || "").trim().toLowerCase();
  const shown = threadList.filter((t) => (!q || t.title.toLowerCase().includes(q) || (t.actor || "").toLowerCase().includes(q))
    && (filter === "all" || FILTERED[filter].includes(t.status)));
  if ($("recentN")) $("recentN").textContent = shown.length || "";
  $("threads").innerHTML = shown.length ? shown.map((t) => `<li data-thread="${esc(t.id)}" class="${chat?.id === t.id ? "sel" : ""}">
      <span class="sdot s-${esc(t.status)}"></span><div class="grow"><div class="req">${esc(t.title)}</div>
      <div class="small">${t.week ? `Week ${t.week} · ` : ""}${esc(when(t.updated).split(" · ")[1] || "")}${t.messages > 1 ? ` · ${t.messages} messages` : ""}${t.mine ? "" : ` · ${esc(t.actor)}`}</div></div>
      ${pill(t.status)}</li>`).join("") : `<li class="small none">${q || filter !== "all" ? "No conversation matches." : "No chats yet."}</li>`;
  for (const li of document.querySelectorAll("#threads li[data-thread]")) li.onclick = () => openThread(li.dataset.thread);
}

async function openThread(id) {
  if (view !== chatTab()) { chat = {id}; show(chatTab()); return; }
  if (source) source.close();
  chat = await api(`/api/threads/${id}`);
  draw(); follow(); refreshLists();
}

function follow() {  // the last message's events, live
  const last = chat?.episodes?.at(-1);
  if (!last || !(last.busy || last.status === "running")) return;
  const id = chat.id, ep = last;
  source = new EventSource(`/api/episodes/${ep.id}/events?after=${ep.events.length}&token=${encodeURIComponent(tabToken() || "")}`);
  const take = async (msg) => {
    const e = JSON.parse(msg.data);
    if (chat?.id !== id || e.n < ep.events.length) return;
    ep.events.push(e);
    if (["end", "waiting", "decision"].includes(e.type)) { await openThread(id); return; }
    draw();
  };
  for (const t of ["model", "model_error", "tool", "reply", "waiting", "end", "decision", "note"]) source.addEventListener(t, take);
  source.onerror = () => source.close();  // the server ends the stream when the episode ends or waits
}

const args = (a) => Object.entries(a || {}).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");
const brief = (a) => Object.values(a || {}).filter((v) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
  .map((v) => Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v)).join(" · ");

function stepHtml(e) {  // one step of the agent's work, in words; the raw call and result one click further
  if (e.type === "model") return e.text && e.calls.length ? `<li class="note">${esc(e.text)}</li>` : "";
  if (e.type === "tool") return `<li class="${e.ok ? "" : "bad"}">${e.ok ? "✓" : "✗"} ${esc(STEP[e.name] || e.name)}
      <span class="small">${esc(brief(e.arguments))}</span>${e.ok ? "" : ` <span class="small">: ${esc(e.result?.message || "")}</span>`}
      <details><summary>details</summary><div class="call">${esc(e.name)}(${esc(args(e.arguments))})</div><pre>${esc(JSON.stringify(e.result, null, 1))}</pre></details></li>`;
  if (e.type === "reply") {
    const what = e.kind === "offer" ? `Asked ${esc(e.to)} to waive “${esc(e.rule)}”` : e.kind === "notice" ? `Told ${esc(e.to)}` : `Asked ${esc(e.to)}`;
    const ans = e.kind === "notice" ? "" : ` → ${e.answer === "no_reply" ? "<i>no reply</i>" : `<b>${esc(e.answer)}</b> ${esc(e.says)}`}`;
    return `<li>💬 ${what}: “${esc(e.text)}”${ans}</li>`;
  }
  if (e.type === "model_error") return `<li class="bad">✗ The model failed: ${esc(e.error?.message || "")}</li>`;
  return "";
}

// what happened to a change, said as a card: [icon, kind, title, line]
function outcome(c) {
  const d = c.decision;
  if (d?.undone) return ["undo", "muted", "Undone by the office", "This change is no longer in the timetable."];
  if (d?.approved) return ["check", "ok", "Request approved", "The office approved it: it is in the timetable now."];
  if (d) return ["x", "bad", "Not approved", d.note || "The office did not approve it."];
  if (c.status === "replaced") return ["undo", "muted", "Replaced", "A later message replaced this draft."];
  if (c.status === "submitted") return ["clock", "warn", "Sent to the office", c.stale ? "The timetable changed since this was drafted: send it again." : "Waiting for the office to approve it."];
  return null;
}

function changesHtml(lines) {
  return `<div class="changes"><div class="small">Proposed changes (${lines.length})</div>${lines.map((l) =>
    `<div class="change"><span class="li-icon">${icon("calendar", 16)}</span><span>${esc(l)}</span></div>`).join("")}</div>`;
}

function episodeHtml(c) {
  const steps = c.events.map(stepHtml).filter(Boolean), working = c.busy || c.status === "running";
  const ms = c.events.reduce((t, e) => t + (e.ms || 0), 0), p = c.pending, can = c.can || {};
  let html = `<div class="msg user"><div class="col"><div class="bubble">${esc(c.request)}</div><div class="small stamp">${esc(c.started.slice(11, 16))}</div></div>
    <span class="avatar">${initial(me.name)}</span></div>
    <div class="msg agent"><span class="avatar bot">${icon("bot", 20)}</span><div class="col">`;
  if (steps.length || working) html += `<details class="thinking" ${working ? "open" : ""}><summary>${working ? "Thinking…" : "Thought"} · ${steps.length} step${steps.length === 1 ? "" : "s"}${ms ? ` · ${(ms / 1000).toFixed(1)} s` : ""}</summary>
      <ol>${steps.join("")}${working ? `<li class="small">working…</li>` : ""}</ol></details>`;
  const end = c.events.findLast((e) => e.type === "end");
  if (!working && !p) {
    const text = c.text || end?.text || c.detail || end?.detail || "";
    const quiet = ["answered", "submitted", "approved", "rejected", "replaced", "undone", "not_committed"].includes(c.status);
    html += `<div class="bubble">${quiet ? "" : `${pill(c.status)} `}${esc(text)}</div>`;
  }
  if (p && !c.busy) {
    if (p.to_requester && c.can?.answer) html += `<div class="bubble ask">${esc(p.text)}
      ${p.options?.length ? `<div class="picks">${p.options.map((o) => `<button class="pick" data-pick="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
      <div class="small">${p.options?.length ? "Pick one, or write your own answer below." : "Answer in the box below."}</div></div>`;
    else html += `<div class="callout stack"><div class="small">${p.kind === "offer" ? `An offer for ${esc(p.to)}` : `A question for ${esc(p.to)}`}</div>
      <div>“${esc(p.text)}”</div>${p.rule ? `<div class="small">Their rule: ${esc(p.rule)}; waived in ${p.weeks.length ? "week " + p.weeks.join(", ") : "every week"}</div>` : ""}
      ${can.answer ? `<textarea data-answer="${esc(c.id)}" placeholder="${p.kind === "offer" ? "Say why (optional)" : "Your answer"}"></textarea>
      <div class="row">${p.kind === "offer" ? `<button class="primary" data-a="yes" data-ep="${esc(c.id)}">Agree</button><button data-a="no" data-ep="${esc(c.id)}">Refuse</button>` :
        `<button class="primary" data-a="said" data-ep="${esc(c.id)}">Answer</button>`}<button data-a="no_reply" data-ep="${esc(c.id)}">Don't answer</button></div>` :
        `<div class="small">Waiting for ${esc(p.to)} to answer.</div>`}</div>`;
  }
  const o = outcome(c);
  if (o) {
    html += `<div class="result ${o[1]}"><div class="result-head"><span class="result-icon">${icon(o[0], 22)}</span><div><b>${o[2]}</b><div>${esc(o[3])}</div></div></div>
      ${c.draft.length ? changesHtml(c.draft) : ""}
      ${can.decide && !c.stale ? `<div class="row"><button class="primary" data-decide="approve" data-ep="${esc(c.id)}">Approve and commit</button>
        <input data-note="${esc(c.id)}" placeholder="Note (for a rejection)"><button class="danger" data-decide="reject" data-ep="${esc(c.id)}">Reject</button></div>` : ""}</div>`;
  }
  html += c.notes.map((n) => `<div class="bubble office"><div class="small">${icon("mail", 14)} The office · ${esc((n.at || "").slice(11, 16))}</div>${esc(n.text)}</div>`).join("");
  return html + "</div></div>";
}

function act(what) {  // a quick action, from the header or a welcome card
  if (what === "timetable") show("timetable");
  else if (what === "inbox") show("requests");
  else if (what === "new") newChat();
  else {
    newChat();
    $("text").value = {free: `When am I free in week ${$("week").value}?`, rooms: `Which rooms are free on Monday at 10 am in week ${$("week").value}?`,
      absence: "I'm away on  in week " + $("week").value + ", please cancel my classes that day.",
      closure: `Room  is closed on  in week ${$("week").value} for maintenance.`}[what] || "";
    if (what === "free") send(); else $("text").focus();
  }
}

function draw() {
  if (!$("msgs")) return;
  for (const li of document.querySelectorAll("#threads li")) li.classList.toggle("sel", li.dataset.thread === chat?.id);
  const first = chat?.episodes?.[0], last = chat?.episodes?.at(-1), p = last?.pending;
  $("chatTitle").textContent = first ? first.request : "New chat";
  $("chatSub").textContent = first ? `Week ${last.week ?? "–"} · ${when(first.started)}${chat.mine ? "" : ` · ${first.actor}`}` :
    me.role === "office" ? "Ask about rooms and people, or make a change" : "Ask about your timetable, or ask for a change";
  $("text").placeholder = !chat ? (me.role === "office" ? "Ask about rooms and people, or close a room…" :
      "Ask about your timetable, request a change, or check availability…")
    : p?.to_requester ? "Answer the agent's question…" : "Ask a follow-up, or change what you asked…";
  const locked = !!chat && (!chat.mine || last?.busy || last?.status === "running" || (!!p && !p.to_requester));
  $("text").disabled = $("send").disabled = locked;
  if (!chat?.episodes) {
    $("msgs").innerHTML = `<div class="welcome">
      <h3>${me.role === "office" ? "How can I help the office?" : "How can I help with your timetable?"}</h3>
      <div class="sub">${me.role === "office" ? "Ask about rooms, people and the rules, or make a change for the department." :
      "Each chat remembers what was said in it. Changes go to the office for approval."}</div>
      <div class="picks">${(me.role === "office" ? ["Which rooms are free on Thursday at 2 pm?", "Who is free on Monday at 10 am?"]
        : ["When am I free on Monday?", "What do I teach this week?", "I'm away next Tuesday, cancel my classes that day"]).map((x) =>
        `<button class="pick" data-try="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div class="cards">${CARDS().map(([a, i, t, line]) => `<button class="acard" data-act="${a}"><span class="acard-top">${icon(i, 18)}${icon("chevron", 16)}</span>
        <b>${t}</b><span class="small">${line}</span></button>`).join("")}</div></div>`;
    for (const b of document.querySelectorAll("[data-try]")) b.onclick = () => { $("text").value = b.dataset.try; $("text").focus(); };
  } else {
    const box = $("msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const open = new Set([...box.querySelectorAll("details.thinking[open]")].map((d) => d.closest("[data-ep-box]").dataset.epBox));
    box.innerHTML = chat.episodes.map((c) => `<div data-ep-box="${esc(c.id)}">${episodeHtml(c)}</div>`).join("");
    for (const d of box.querySelectorAll("details.thinking")) if (open.has(d.closest("[data-ep-box]").dataset.epBox)) d.open = true;
    if (atEnd) box.scrollTop = box.scrollHeight;
    for (const b of document.querySelectorAll("[data-a]")) b.onclick = () => answer(b.dataset.ep, b.dataset.a);
    for (const b of document.querySelectorAll("[data-pick]")) b.onclick = () => { $("text").value = b.dataset.pick; send(); };
    for (const b of document.querySelectorAll("[data-decide]")) b.onclick = () => decide(b.dataset.ep, b.dataset.decide);
  }
  for (const b of document.querySelectorAll("[data-act]")) b.onclick = () => act(b.dataset.act);
}

async function answer(eid, kind) {
  const box = document.querySelector(`[data-answer="${eid}"]`), text = box?.value.trim() || "";
  if (kind === "said" && !text) { box.focus(); return; }
  try {
    await api(`/api/episodes/${eid}/reply`, {method: "POST", body: JSON.stringify({answer: kind, text})});
    await openThread(chat.id);
  } catch (e) { alert(e.message); }
}

async function decide(eid, what) {
  try {
    const note = document.querySelector(`[data-note="${eid}"]`)?.value || "";
    await api(`/api/episodes/${eid}/${what}`, {method: "POST", body: what === "reject" ? JSON.stringify({note}) : "{}"});
    await openThread(chat.id);
    dep = await api("/api/department"); meta();
  } catch (e) { alert(e.message); }
}

// -- the office's inbox: what reached it from teachers, one item each -----------------------------------------------
// A change sent for approval, or a request the agent passed on. Open one: approve, reject, or write to the teacher.

let officeOpen = null;  // the id of the request open in the office's inbox

function officeView() {
  $("app").innerHTML = `<main class="chat two">
    <aside class="side">
      <h2>Needs you</h2><ul class="list" id="oNeeds"></ul>
      <h2>Done</h2><ul class="list" id="oDone"></ul>
    </aside>
    <section class="convo card">
      <div class="convo-head"><button class="iconbtn side-btn" title="Show or hide the side bar" aria-label="Show or hide the side bar">${icon("panel")}</button>
        <span class="itile">${icon("inbox", 20)}</span><div class="grow"><div class="title">Office inbox</div>
        <div class="small">Changes sent for approval, and requests the agent passed on</div></div></div>
      <div id="oItem" class="msgs"></div>
    </section></main>`;
  sideToggle();
  refreshOffice();
}

async function refreshOffice() {
  if (!$("oNeeds")) return;
  let items;
  try { items = await api("/api/office/requests"); } catch { return; }
  const li = (c) => `<li data-oid="${esc(c.id)}" class="${officeOpen === c.id ? "sel" : ""}"><span class="avatar sm">${initial(c.actor)}</span>
    <div class="grow"><div class="req">${esc(c.request)}</div><div class="small">${esc(c.actor)} · ${esc(when(c.started))}</div></div>
    ${pill(c.status, c.status === "submitted" ? "to approve" : c.status)}</li>`;
  const needs = items.filter((c) => c.needs_office), done = items.filter((c) => !c.needs_office);
  $("oNeeds").innerHTML = needs.map(li).join("") || `<li class="small none">Nothing waits for the office.</li>`;
  $("oDone").innerHTML = done.map(li).join("") || `<li class="small none">None yet.</li>`;
  railDot("requests", needs.length);
  for (const x of document.querySelectorAll("li[data-oid]")) x.onclick = () => { officeOpen = x.dataset.oid; drawOffice(items); refreshOffice(); };
  if (!officeOpen && needs.length) officeOpen = needs[0].id;
  drawOffice(items);
}

function drawOffice(items) {
  const c = items.find((x) => x.id === officeOpen);
  if (!c) { $("oItem").innerHTML = `<div class="empty">Requests that need the office show up here, one at a time.</div>`; return; }
  if ($("oItem").dataset.shown === `${c.id}:${c.status}:${c.notes.length}`) return;  // keep a half-written message
  $("oItem").dataset.shown = `${c.id}:${c.status}:${c.notes.length}`;
  const steps = c.events.map(stepHtml).filter(Boolean);
  const what = c.status === "submitted" ? "asks for this change" : c.status === "escalated" ? "was passed to the office" : label(c.status);
  const decided = c.decision ? `<div class="callout ${c.decision.approved ? "ok" : ""}">${c.decision.approved ? "Approved" : "Rejected"}
    ${c.decision.note ? `: ${esc(c.decision.note)}` : ""}</div>` : "";
  $("oItem").innerHTML = `<div class="panel stack office-item">
      <div class="small">${esc(c.actor)} · week ${c.week ?? "–"} · ${esc(c.started.replace("T", " "))} · <span class="badge s-${esc(c.status)}">${label(c.status)}</span></div>
      <div style="font-size:16px">“${esc(c.request)}”</div>
      <div class="small">${esc(c.actor)} ${what}.</div>
      ${c.text || c.detail ? `<div><b>The agent:</b> ${esc(c.text || c.detail)}</div>` : ""}
      ${c.draft.length ? `<div><b>Proposed changes</b><ul>${c.draft.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${c.status === "submitted" && c.draft.some((d) => /\bfrom week \d+\b(?!\s*to)|\bevery week\b/.test(d)) ? `<div class="callout">⚠️ This holds
        <b>until the end of term</b>, not for one week. Check that ${esc(c.actor)} asked for that before approving.</div>` : ""}
      ${c.stale && c.status === "submitted" ? `<div class="callout">The timetable changed since this was drafted, so it can't be approved as it is. Tell ${esc(c.actor)} to send it again.</div>` : ""}
      ${steps.length ? `<details class="thinking"><summary>How the agent got here · ${steps.length} steps</summary><ol>${steps.join("")}</ol></details>` : ""}
      ${c.notes.map((n) => `<div class="msg agent"><div class="bubble office">${esc(n.text)}<div class="small">the office · ${esc((n.at || "").slice(11, 16))}</div></div></div>`).join("")}
      ${decided}
      <textarea id="oNote" placeholder="A message to ${esc(c.actor)} (optional with Approve or Reject)"></textarea>
      <div class="row">
        ${c.can.decide && !c.stale ? `<button class="primary" id="oYes">Approve</button><button class="danger" id="oNo">Reject</button>` : ""}
        ${c.status === "approved" ? `<button class="danger" id="oUndo" title="Take this change back out of the timetable">Undo this change</button>` : ""}
        <button id="oSay">Send message only</button><span class="small" id="oErr"></span></div></div>`;
  const act = async (path, body) => {
    try { await api(`/api/episodes/${c.id}/${path}`, {method: "POST", body: JSON.stringify(body)}); $("oItem").dataset.shown = "";
      await refreshOffice(); dep = await api("/api/department"); meta();
    } catch (e) { $("oErr").textContent = e.message; }
  };
  const note = () => $("oNote").value.trim();
  if ($("oYes")) $("oYes").onclick = () => act("approve", {note: note()});
  if ($("oNo")) $("oNo").onclick = () => act("reject", {note: note()});
  if ($("oUndo")) $("oUndo").onclick = () => confirm(`Undo this change for ${c.actor}? Their timetable goes back to how it was before it.`)
    && act("undo", {note: note()});
  $("oSay").onclick = () => note() ? act("note", {note: note()}) : $("oNote").focus();
}


// -- notifications: a bell in the header ---------------------------------------------------------------------------
// Your requests approved or not, the office's messages, and other people's approved changes that move your classes.

const ICON = {approved: "✅", rejected: "⛔", not_committed: "⚠️", office: "✉️", affected: "📅", undone: "↩️"};
const HEAD = {approved: "Approved", rejected: "Not approved", not_committed: "Not committed", office: "The office wrote",
  affected: "Your classes changed", undone: "Undone by the office"};
let told = [], toldNewest = null;  // the newest notice seen by this tab, so a newer one pops up once

const seenKey = () => `nts.seen.${me.dept}.${me.name}`;

async function refreshBell() {
  if (!$("bell")) return;
  try { told = await api("/api/notices"); } catch { return; }
  const seen = remember(seenKey()) || "";
  const fresh = told.filter((n) => n.at > seen).length;
  $("bellDot").textContent = fresh ? String(fresh) : "";
  $("bellDot").hidden = !fresh;
  const newest = told[0]?.at || "";
  if (toldNewest !== null && newest > toldNewest && newest > seen) toast(told[0]);
  toldNewest = newest;
  if (!$("bellPanel").hidden) drawBell();
}

function drawBell() {
  const seen = remember(seenKey()) || "";
  $("bellPanel").innerHTML = `<div class="row"><b>Notifications</b><button class="link" id="bellClose" style="margin-left:auto">Close</button></div>` +
    (told.length ? told.map((n, i) => `<div class="notice ${n.at > seen ? "new" : ""}" data-n="${i}">
      <div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b> <span class="small">· ${esc(n.at.slice(5, 16).replace("T", " "))}</span></div>
      ${n.mine ? `<div class="small">Your request: “${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div></div>`).join("")
      : `<div class="empty">Nothing yet. When the office decides on a request, or a change moves one of your classes, it shows up here.</div>`);
  $("bellClose").onclick = () => { $("bellPanel").hidden = true; };
  for (const x of document.querySelectorAll("[data-n]")) x.onclick = () => {
    const n = told[Number(x.dataset.n)];
    $("bellPanel").hidden = true;
    if (n.mine && me.role !== "office") openThread(n.thread);
    else if (n.kind === "affected") show("timetable");
  };
}

function toast(n) {  // a new notification, for a few seconds; a click opens the bell
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast panel";
  t.innerHTML = `<div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b></div>
    ${n.mine ? `<div class="small">“${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div>`;
  t.onclick = () => { t.remove(); toggleBell(); };
  document.body.append(t);
  setTimeout(() => t.remove(), 8000);
}

function toggleBell() {
  $("bellPanel").hidden = !$("bellPanel").hidden;
  if (!$("bellPanel").hidden) {
    drawBell();
    if (told.length) remember(seenKey(), told[0].at);  // newest first: all of these are seen now
    $("bellDot").hidden = true;
  }
}

async function trace(id) {
  const spans = await api(`/api/obs/trace/${id}`);
  const line = (s) => {
    const a = s.attrs;
    if (s.kind === "model_call") { const r = a.response || {}; return `${esc(r.text || "")} ${(r.tool_calls || []).map((c) => `<span class="call">${esc(c.name)}(${esc(args(c.arguments))})</span>`).join(" ")}`; }
    if (s.kind === "tool_call") return a.ok ? "ok" : `<span class="s-failed">${esc(a.result?.error?.code)}: ${esc(a.result?.error?.message)}</span>`;
    if (s.kind === "reply") return `“${esc(a.ask?.text)}” → ${esc(a.reply?.answer)} ${esc(a.reply?.text)}`;
    if (s.kind === "evaluation") return a.passed ? `<span class="s-passed">passed</span>` : `<span class="s-failed">failed: ${esc((a.failures || []).join("; "))}</span>`;
    if (s.kind === "episode" || s.kind === "resume") return `${label(a.status)} ${esc(a.text || a.detail || "")}`;
    if (s.kind === "approval") return a.committed ? "committed" : `not committed ${esc(a.note || a.reason || "")}`;
    return "";
  };
  $("otrace").innerHTML = `<div class="panel stack" style="margin-top:12px"><div class="row"><h2 style="margin:0">Trace ${esc(id)}</h2><button class="link" id="tclose" style="margin-left:auto">Close</button></div>
    <table class="data"><tr><th>Span</th><th>Name</th><th>ms</th><th>What</th></tr>${spans.filter((s) => s.kind !== "turn").map((s) =>
      `<tr><td class="small">${esc(s.kind)}</td><td>${esc(s.name)}</td><td class="n">${Math.round(s.ms)}</td><td>${line(s)}<details><summary>attributes</summary><pre>${esc(JSON.stringify(s.attrs, null, 1))}</pre></details></td></tr>`).join("")}</table></div>`;
  $("tclose").onclick = () => { $("otrace").innerHTML = ""; };
  $("otrace").scrollIntoView({behavior: "smooth"});
}

async function evals() {
  const r = await api("/api/obs/evals");
  $("oevals").innerHTML = `<table class="data"><tr><th>Report</th><th>Model</th><th>When</th><th>Passed</th><th>Families</th></tr>
    ${r.map((x) => `<tr><td>${esc(x.report)}</td><td class="small">${esc(x.model)}</td><td class="small">${esc(x.when.replace("T", " "))}</td>
      <td class="n">${x.n ? `${x.passed}/${x.n}` : "–"}</td><td class="small">${Object.entries(x.families).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</td></tr>`).join("")}</table>`;
}

theme();
start().catch((e) => { $("app").innerHTML = `<div class="empty">Could not reach the API: ${esc(e.message)}</div>`; });
</script>
</body>
</html>

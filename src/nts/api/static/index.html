<html lang="en">
<head>

<style>
/* "Paper and ink", the demo app's look (frontend/src/index.css): a printed timetable on warm paper, one blue accent. */
:root {
  --bg: #f5f3ee; --panel: #fffefb; --panel-2: #f0ede6; --line: #e2ddd2;
  --ink: #1f1d1a; --ink-2: #4d4940; --ink-3: #8a8477;
  --brand: #2b4c8c; --ok: #3d7a4e; --warn: #a8660f; --bad: #b3443a; --info: #56708f;
  --shadow: 0 10px 28px rgba(40, 35, 25, .12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #1d1c19; --panel-2: #262420; --line: #34312c;
    --ink: #ece8df; --ink-2: #bdb6a8; --ink-3: #847e72;
    --brand: #8fa8dc; --ok: #86b894; --warn: #d9a54a; --bad: #e0857a; --info: #9aaecb;
    --shadow: 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1d1c19; --panel-2: #262420; --line: #34312c;
  --ink: #ece8df; --ink-2: #bdb6a8; --ink-3: #847e72;
  --brand: #8fa8dc; --ok: #86b894; --warn: #d9a54a; --bad: #e0857a; --info: #9aaecb;
  --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
::selection { background: color-mix(in oklab, var(--brand) 22%, transparent); }
:focus-visible { outline: 2px solid color-mix(in oklab, var(--brand) 60%, transparent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }
.ic { flex: none; display: block; }
.serif, h1, .welcome h3 { font-family: "Source Serif 4", ui-serif, Georgia, serif; }
kbd, .call, pre, code { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
option { background: var(--panel); color: var(--ink); }

/* -- the shell: a sidebar like the demo app's, the page beside it ---------------------------------------------- */
.shell { display: flex; height: 100vh; }
#app { flex: 1; min-width: 0; overflow-y: auto; }
.sidebar { position: relative; width: 240px; flex: none; display: flex; flex-direction: column; height: 100vh;
  background: var(--panel); border-right: 1px solid var(--line); transition: width .2s ease-out; }
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 16px 16px; min-width: 0; }
.brand .mark { color: var(--brand); flex: none; display: grid; }
.brand .name { min-width: 0; }
.brand .title { margin: 0; font: 600 15.5px/1.2 "Source Serif 4", ui-serif, Georgia, serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .dept { margin: 0; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collapse { position: absolute; right: -12px; top: 26px; z-index: 6; width: 24px; height: 24px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--ink-3); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.collapse:hover { color: var(--ink); border-color: color-mix(in oklab, var(--brand) 60%, transparent); }
nav.nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 12px; display: flex; flex-direction: column; gap: 1px; }
nav.nav:empty { visibility: hidden; }
.nav-group { margin: 14px 10px 4px; font-size: 11px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
nav.nav button { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; width: 100%; padding: 0 10px;
  border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 13.5px; text-align: left; white-space: nowrap; }
nav.nav button .ic { color: var(--ink-3); }
nav.nav button:hover { background: color-mix(in oklab, var(--panel-2) 60%, transparent); color: var(--ink); }
nav.nav button.on { background: var(--panel-2); color: var(--ink); font-weight: 500; }
nav.nav button.on .ic { color: var(--brand); }
nav.nav button .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.dot { background: var(--brand); color: var(--panel); border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; line-height: 17px;
  font-variant-numeric: tabular-nums; }
.side-foot { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.side-foot:empty { display: none; }
.status { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.me { display: flex; align-items: center; gap: 4px; }
.userbox, .bellbox { position: relative; }
.userbox { flex: 1; min-width: 0; }
.user { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 6px; border-radius: 6px; color: var(--ink); text-align: left; }
.user:hover { background: var(--panel-2); }
.user-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; flex: 1; }
.user-text b { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-text .small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user > .ic { color: var(--ink-3); }
.iconbtn { border: 0; background: none; color: var(--ink-3); width: 32px; height: 32px; padding: 0; border-radius: 6px; display: grid; place-items: center; flex: none; }
.iconbtn:hover { color: var(--ink); background: var(--panel-2); }
.bell .dot { position: absolute; top: 1px; right: -2px; padding: 0 4px; font-size: 10px; line-height: 14px; }
.panel.menu { position: absolute; left: 0; bottom: 48px; width: 256px; z-index: 30; padding: 0; overflow: hidden; box-shadow: var(--shadow); }
.menu #meta { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-radius: 0; background: none; padding: 9px 12px; color: var(--ink-2); font-size: 13px; }
.menu-item:hover { background: var(--panel-2); color: var(--ink); }
.panel.menu { width: 280px; }
.people-h { margin: 0; padding: 8px 12px; font-size: 11.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.people { max-height: 300px; overflow-y: auto; padding: 4px; }
.person { display: flex; align-items: center; border-radius: 6px; }
.person:hover, .person.cur { background: var(--panel-2); }
.person-go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; background: none; text-align: left; font-weight: 400; }
.person-go:hover { background: none; }
.person-go:disabled { opacity: 1; cursor: default; }
.person-go .avatar { width: 24px; height: 24px; font-size: 9.5px; }
.person-go b { display: block; font-size: 13px; font-weight: 400; }
.person-go .small { display: block; font-size: 11px; }
.person .iconbtn { width: 28px; height: 28px; margin-right: 4px; opacity: 0; }
.person:hover .iconbtn, .person .iconbtn:focus { opacity: 1; }
#people + .menu-item { border-top: 1px solid var(--line); }
.bell-panel { position: absolute; left: calc(100% + 8px); bottom: 0; width: min(400px, 80vw); max-height: 70vh; overflow-y: auto; z-index: 30; box-shadow: var(--shadow); }
.avatar { --c: var(--ink-3); width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 11px;
  color: var(--c); background: color-mix(in oklab, var(--c) 16%, var(--panel)); }
.avatar.sm { width: 24px; height: 24px; font-size: 9.5px; }

/* folded: icons only, as the demo app's sidebar */
.shell.folded .sidebar { width: 56px; }
.shell.folded .brand { justify-content: center; padding: 20px 8px 16px; }
.shell.folded .brand .name, .shell.folded .nav-group, .shell.folded nav.nav .lbl, .shell.folded .status span:not(.live),
.shell.folded .user-text, .shell.folded .user > .ic { display: none; }
.shell.folded nav.nav { padding: 4px 8px; }
.shell.folded nav.nav button { justify-content: center; padding: 0; }
.shell.folded nav.nav .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; padding: 0; font-size: 0; border-radius: 50%; }
.shell.folded .nav-sep { display: block; }
.nav-sep { display: none; margin: 8px; border-top: 1px solid var(--line); }
.shell.folded .side-foot { padding: 12px 8px; align-items: center; }
.shell.folded .status { padding: 0; justify-content: center; }
.shell.folded .me { flex-direction: column; }
.shell.folded .user { justify-content: center; padding: 4px; }
.shell.folded .panel.menu { left: calc(100% + 8px); bottom: 0; }

/* -- shared pieces ------------------------------------------------------------------------------------------------ */
select, input, textarea, button { font: inherit; color: inherit; }
select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; outline: none; font-size: 13.5px; }
select:focus, input:focus, textarea:focus { border-color: color-mix(in oklab, var(--brand) 60%, transparent); }
textarea { width: 100%; resize: vertical; min-height: 64px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
button:hover { background: var(--panel-2); }
button.primary { background: var(--brand); color: var(--panel); border-color: var(--brand); }
button.primary:hover { background: color-mix(in oklab, var(--brand) 90%, var(--panel)); }
button.danger { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 30%, transparent); }
button.danger:hover { background: color-mix(in oklab, var(--bad) 8%, transparent); }
button.link { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 500; }
button:disabled { opacity: .5; cursor: not-allowed; }

main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 28px 32px; max-width: 1280px; margin: 0 auto; }
main.wide { grid-template-columns: 1fr; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; margin-bottom: 4px;
  border-bottom: 1px solid var(--line); }
.page-head h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; }
.page-head p { margin: 4px 0 0; max-width: 680px; font-size: 13.5px; color: var(--ink-3); }
.panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0; }
.panel h2, #pane h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 10px; font-weight: 500; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.small { font-size: 12.5px; color: var(--ink-3); }
.badge { --t: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; text-transform: capitalize;
  padding: 2px 6px; border-radius: 4px; white-space: nowrap; color: var(--t); background: color-mix(in oklab, var(--t) 12%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-running, .s-submitted { --t: var(--brand); color: var(--brand); }
.s-waiting, .s-declined, .s-escalated { --t: var(--warn); color: var(--warn); }
.s-approved, .s-answered, .s-passed { --t: var(--ok); color: var(--ok); }
.s-rejected, .s-model_error, .s-budget_exhausted, .s-stuck, .s-not_committed, .s-failed { --t: var(--bad); color: var(--bad); }
.s-replaced, .s-interrupted, .s-undone, .s-stopped { --t: var(--ink-3); color: var(--ink-3); }
.call { font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; color: var(--ink-2); }
details summary { cursor: pointer; color: var(--ink-3); font-size: 12.5px; }
details summary:hover { color: var(--ink); }
pre { background: var(--panel-2); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow: auto; font-size: 11.5px; line-height: 1.6;
  max-height: 300px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.callout { border: 1px solid color-mix(in oklab, var(--warn) 35%, transparent); border-radius: 8px; padding: 12px 14px;
  background: color-mix(in oklab, var(--warn) 7%, var(--panel)); }
.callout.ok { border-color: color-mix(in oklab, var(--ok) 35%, transparent); background: color-mix(in oklab, var(--ok) 7%, var(--panel)); }
.empty { color: var(--ink-3); padding: 48px 24px; text-align: center; font-size: 13px; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
table.data th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover { background: var(--panel-2); }
.scroll { overflow-x: auto; }
.bar { height: 6px; background: var(--brand); border-radius: 999px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--panel); }
.tile .v { margin-top: 4px; font: 600 28px/1.1 "Source Serif 4", ui-serif, Georgia, serif; font-variant-numeric: tabular-nums; }
.tile .v .small { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 400; }
.login { max-width: 400px; margin: 12vh auto; }
.login h1 { font-size: 24px; margin: 6px 0 2px; font-weight: 600; }
.login .mark { color: var(--brand); }
.login button.primary { width: 100%; height: 36px; }
.login select, .login input { width: 100%; }
.itile { width: 36px; height: 36px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-3); }
kbd { font-size: 10.5px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 0 4px; color: var(--ink-3); white-space: nowrap; flex: none; }
mark { background: color-mix(in oklab, var(--warn) 28%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

/* the timetable: classes coloured per course, the lunch hour hatched, as on the demo app's grid */
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; font-size: 12px; min-width: 760px; }
table.grid th { padding: 0 6px 10px; font-weight: 600; font-size: 12px; color: var(--ink-3); text-align: center; }
table.grid td { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 4px; vertical-align: top; height: 64px; }
table.grid td.h { width: 64px; border: 0; padding: 8px 10px 0 0; color: var(--ink-3); white-space: nowrap; text-align: right;
  font: 11px "JetBrains Mono", ui-monospace, monospace; }
table.grid tr:last-child td:not(.h) { border-bottom: 1px solid var(--line); }
table.grid td:last-child { border-right: 1px solid var(--line); }
.hatch { background-image: repeating-linear-gradient(135deg, color-mix(in oklab, var(--ink-3) 14%, transparent) 0 5px, transparent 5px 10px); }
.cls { --c: var(--brand); border-left: 3px solid var(--c); background: color-mix(in oklab, var(--c) 10%, var(--panel)); border-radius: 4px;
  padding: 5px 8px; margin-bottom: 4px; font-size: 10.5px; color: var(--ink-3); line-height: 1.35; overflow: hidden; }
.cls b { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* -- chat: the list of conversations and the conversation ---------------------------------------------------------- */
main.chat, main.chat.two { grid-template-columns: 300px minmax(0, 1fr); height: 100vh; padding: 0; gap: 0; max-width: none; }
main.chat.closed, main.chat.two.closed { grid-template-columns: minmax(0, 1fr); }
main.chat.closed .side { display: none; }
.side { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 16px 14px; background: var(--panel);
  border-right: 1px solid var(--line); }
.side h2 { text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; color: var(--ink-3); margin: 12px 6px 2px; display: flex; justify-content: space-between; }
.new-req { display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; background: var(--brand);
  color: var(--panel); border-color: var(--brand); font-size: 13px; }
.new-req:hover { background: color-mix(in oklab, var(--brand) 90%, var(--panel)); }
.new-req span { flex: none; }
.new-req kbd { background: transparent; border-color: color-mix(in oklab, var(--panel) 40%, transparent); color: var(--panel); margin-left: 4px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 0 10px; color: var(--ink-3); }
.search:focus-within { border-color: color-mix(in oklab, var(--brand) 60%, transparent); }
.search input { border: 0; background: none; flex: 1; min-width: 0; padding: 7px 0; color: var(--ink); }
.filters { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.filters button { border: 0; background: none; color: var(--ink-3); padding: 3px 9px; border-radius: 4px; font-size: 12.5px; white-space: nowrap; }
.filters button:hover { color: var(--ink); background: none; }
.filters button.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.list li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.list li:hover { background: color-mix(in oklab, var(--panel-2) 60%, transparent); }
.list li.sel { background: var(--panel-2); }
.list li.none { cursor: default; padding: 10px; } .list li.none:hover { background: none; }
.list .req { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; font-size: 13px; color: var(--ink); }
.list .req::first-letter { text-transform: uppercase; }
.list li .small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.list li .badge { flex: none; margin-top: 1px; }
.li-icon { color: var(--ink-3); display: grid; place-items: center; padding-top: 2px; }
.sdot { display: none; }
.convo { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; background: var(--bg); border: 0; border-radius: 0; }
.convo-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 56px; border-bottom: 1px solid var(--line); background: var(--panel); }
.convo-head .title { font: 600 16px/1.3 "Source Serif 4", ui-serif, Georgia, serif; }
.head-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.head-text b { overflow: hidden; text-overflow: ellipsis; font: 600 15.5px/1.3 "Source Serif 4", ui-serif, Georgia, serif; }
.head-text .small { overflow: hidden; text-overflow: ellipsis; }
.head-text .small:not(:empty)::before { content: "· "; }
.head-acts { display: flex; gap: 8px; }
.ghost { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; font-size: 13px; }
.ghost .ic { color: var(--ink-3); }
.msgs { flex: 1; overflow-y: auto; padding: 24px max(24px, calc((100% - 820px) / 2)); }
.msg { display: flex; gap: 12px; margin: 16px 0; align-items: flex-start; }
.msg .avatar { display: none; }
.msg .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 760px; flex: 1; }
.msg.user { justify-content: flex-end; }
.msg.user .col { align-items: flex-end; flex: none; max-width: 80%; }
.msg .stamp { margin-top: -6px; font-size: 11px; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.msg.user .bubble { padding: 9px 14px; border-radius: 8px; background: color-mix(in oklab, var(--brand) 9%, var(--panel));
  border: 1px solid color-mix(in oklab, var(--brand) 18%, var(--line)); }
.msg.agent .bubble { color: var(--ink); }
.bubble.ask { padding: 12px 14px; border-radius: 8px; background: var(--panel); border: 1px solid color-mix(in oklab, var(--warn) 45%, var(--line));
  border-left: 3px solid var(--warn); }
.bubble.office { padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brand); }
.bubble.office .small .ic { display: inline-block; vertical-align: -2px; }
.thinking > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; user-select: none; }
.thinking > summary::-webkit-details-marker { display: none; }
.thinking > summary .ic { transition: transform .15s; }
.thinking[open] > summary .ic { transform: rotate(90deg); }
.thinking ol { margin: 6px 0 0 6px; padding: 2px 0 2px 26px; border-left: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.thinking li { margin: 5px 0; }
.thinking li.bad { color: var(--bad); }

.shimmer { background: linear-gradient(90deg, var(--ink-3) 0%, var(--ink) 50%, var(--ink-3) 100%); background-size: 200% 100%;

.result { --t: var(--ink-3); border: 1px solid var(--line); border-left: 3px solid var(--t); border-radius: 8px; padding: 12px 14px; background: var(--panel);

.changes { display: flex; flex-direction: column; gap: 6px; }

  background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.composer:focus-within { border-color: color-mix(in oklab, var(--brand) 60%, transparent); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 8px; background: var(--panel-2); }

.send { margin-left: auto; width: 38px; height: 32px; padding: 0; border-radius: 6px; display: grid; place-items: center; }
.send:disabled { background: var(--panel-2); border-color: var(--line); color: var(--ink-3); opacity: 1; }

/* -- the Requests page (the demo app's RequestChat): the list card and the conversation card --------------------- */
main.rq { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 16px; height: 100vh; padding: 16px 24px;
  max-width: none; margin: 0; }

.rq-tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }

.rq-items { flex: 1; overflow-y: auto; padding: 4px 6px; }
.none-msg { padding: 24px 12px; text-align: center; }
.rq-chat-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 56px; }
.head-text.stacked { flex-direction: column; align-items: flex-start; gap: 1px; }

.head-text.stacked .small::before { content: none; }
.rq-chat .msgs { padding: 20px max(20px, calc((100% - 760px) / 2)); }
.rq-chat .composer { width: min(760px, calc(100% - 32px)); margin: 0 auto 16px; }
.try-h { margin: 14px 0 2px; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.tries { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; }

.try:hover { color: var(--ink); border-color: color-mix(in oklab, var(--brand) 45%, var(--line)); background: var(--panel); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); padding: 4px 2px; cursor: pointer; }
.switch input { display: none; }
.switch .track { width: 28px; height: 16px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); transition: transform .15s; }
.switch input:checked + .track { background: var(--brand); border-color: var(--brand); }
.switch input:checked + .track::after { transform: translateX(12px); background: var(--panel); }
.welcome { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 7vh 0 24px; }
.welcome h3 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.2; }

.picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.pick { border-radius: 999px; padding: 5px 13px; font-weight: 400; font-size: 13px; color: var(--ink-2); }
.pick:hover { border-color: color-mix(in oklab, var(--brand) 50%, var(--line)); color: var(--ink); background: var(--panel); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; margin-top: 18px; }
.acard { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 14px 16px; border-radius: 8px; background: var(--panel); font-weight: 400; }

.office-item { max-width: 900px; margin: 0 auto; }

/* -- notifications ------------------------------------------------------------------------------------------------ */

/* -- before and after a change, for the office ---------------------------------------------------------------------- */
.preview { display: flex; flex-direction: column; gap: 8px; }
.pv { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mini-title { font-size: 11.5px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.mini { display: grid; grid-template-columns: 46px repeat(var(--days), minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  font-size: 11px; background: var(--panel); border-radius: 4px; overflow: hidden; }
.mini > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 34px; padding: 2px; min-width: 0; }
.mini .mh { min-height: 0; color: var(--ink-3); padding: 3px 5px; background: var(--panel-2); font-weight: 600; }
.mini .mh.hr { text-align: right; font: 10px "JetBrains Mono", ui-monospace, monospace; white-space: nowrap; color: var(--ink-3); }
.mini .lunch { background-image: repeating-linear-gradient(135deg, color-mix(in oklab, var(--ink-3) 14%, transparent) 0 5px, transparent 5px 10px); }
.mb { --c: var(--brand); border-left: 2px solid var(--c); background: color-mix(in oklab, var(--c) 10%, var(--panel)); border-radius: 3px; padding: 2px 4px;
  line-height: 1.25; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }

.pv .mini-wrap:last-child .mb.moved, .mb.added { opacity: 1; text-decoration: none; outline: 1.5px solid var(--ok);
  background: color-mix(in oklab, var(--ok) 16%, var(--panel)); }

/* -- how it works (the demo app's How it works) ------------------------------------------------------------------- */
.how-track { padding: 24px 20px 8px; }
.how-track ol { --p: 0%; position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.how-track ol::before, .how-track ol::after { content: ""; position: absolute; top: 19px; left: 8.33%; height: 2px; border-radius: 2px; }
.how-track ol::before { right: 8.33%; background: var(--line); }
.how-track ol::after { width: calc(var(--p) * .8333); background: var(--brand); transition: width .6s ease-in-out; }
.how-track li { position: relative; z-index: 1; }
.how-track button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; text-align: center; font-weight: 400; }
.how-track button:hover { background: none; }
.how-dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--line);
  color: var(--ink-3); transition: all .25s; }
.how-track button.done .how-dot { border-color: var(--brand); color: var(--brand); }
.how-track button.on .how-dot { border-color: var(--brand); background: var(--brand); color: var(--panel); transform: scale(1.08); }
.how-track b { margin-top: 4px; font-size: 13px; font-weight: 500; }

.how-scene { margin: 12px 20px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); min-height: 132px; }
.how-scene-i { display: flex; gap: 16px; padding: 18px 20px; animation: fade-in .3s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.how-big { width: 44px; height: 44px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--brand);
  background: color-mix(in oklab, var(--brand) 12%, transparent); }
.how-scene h4 { margin: 0 0 6px; font: 600 16px "Source Serif 4", ui-serif, Georgia, serif; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.how-scene h4 .badge { font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-transform: none; }
.how-scene p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); max-width: 820px; }
.how-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.how-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.how-models { padding: 18px 20px; }

  background: color-mix(in oklab, var(--brand) 8%, transparent); }

.how-models ul { list-style: none; margin: 4px 0 0 18px; padding: 0; border-left: 2px solid var(--line); }
.how-models li { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 0 0 22px; font-size: 13px; }
.how-models li::before { content: ""; position: absolute; left: 0; top: calc(50% + 5px); width: 14px; height: 2px; background: var(--line); }

.how-models code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 8px; border-radius: 4px; background: var(--panel-2);
  font-size: 11.5px; color: var(--ink-2); }
.how-safe { list-style: none; margin: 0; padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.how-safe li { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; line-height: 1.5; }
.how-safe li span { width: 28px; height: 28px; flex: none; border-radius: 6px; display: grid; place-items: center; color: var(--ok);
  background: color-mix(in oklab, var(--ok) 12%, transparent); }
.how-real { padding: 18px 20px; }
.how-real .quote { margin: 0 0 10px; font: 500 17px/1.45 "Source Serif 4", ui-serif, Georgia, serif; }
.how-steps { margin: 0; padding-left: 22px; font-size: 13px; color: var(--ink-2); border-left: 1px solid var(--line); }

/* -- the week bar (the demo app's WeekStepper) ------------------------------------------------------------------ */

.wk-now { min-width: 72px; text-align: center; font-size: 13px; font-weight: 500; line-height: 1.15; }

.wk-strip { display: flex; align-items: center; gap: 2px; }
.wk { position: relative; width: 24px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: none; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* -- a teacher's home: the week on the left, their requests on the right (the demo app's request workspace) ----- */
main.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 30%); gap: 16px; height: 100vh; padding: 16px 24px;
  max-width: none; margin: 0; }
.work-main { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar select { height: 32px; padding: 0 8px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 0 2px; }
.stepper .iconbtn { width: 28px; height: 30px; }
#wkLabel { font-size: 15.5px; font-weight: 600; min-width: 72px; text-align: center; }
.tt-card { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.tt-card table.grid td { height: 72px; }
.page-head .row button { display: inline-flex; align-items: center; gap: 6px; height: 34px; }
.work-side .composer textarea { max-height: 160px; overflow-y: auto; }
.hint { margin: 0; font-size: 12px; }
/* a class rep's home: what approved changes did to the section's classes, above its week */
.rep-changes { flex: none; max-height: 176px; overflow: auto; }
.rep-changes .box-h { padding: 10px 14px; }
.rep-changes .notice { display: flex; gap: 10px; align-items: baseline; padding: 8px 14px; border-radius: 0; }

.rep-changes .empty { padding: 12px 14px; }
.work-side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.conv-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
#convSel { flex: 1; min-width: 0; border: 0; background: none; font-weight: 500; padding: 6px 4px; cursor: pointer; }

.work-side .msgs { padding: 14px 16px; }
.work-side .msg .col { max-width: 100%; }
.work-side .msg.user .col { max-width: 88%; }

.welcome.compact { padding: 8px 0; gap: 8px; }
.welcome.compact h3 { font-size: 20px; }
.welcome.compact .sub { font-size: 13px; }
.welcome.compact .callout { margin-top: 8px; width: 100%; }

/* a class on the grid is a button: click it to act on it */
button.cls { display: block; width: 100%; text-align: left; font: inherit; font-size: 10.5px; border: 0; border-left: 3px solid var(--c);
  cursor: pointer; transition: box-shadow .12s; }
button.cls:hover { background: color-mix(in oklab, var(--c) 18%, var(--panel)); box-shadow: 0 0 0 1px color-mix(in oklab, var(--c) 45%, transparent); }
.lunch { display: grid; place-items: center; height: 100%; min-height: 40px; font-size: 11px; color: var(--ink-3); }
.class-menu { position: fixed; z-index: 60; width: 290px; padding: 0; overflow: hidden; box-shadow: var(--shadow); }
.cm-head { --c: var(--brand); padding: 10px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--c);
  background: color-mix(in oklab, var(--c) 8%, var(--panel)); }
.cm-head b { display: block; font-size: 13.5px; }
.cm-head .small { font-size: 11.5px; line-height: 1.45; }
.class-menu .menu-item { align-items: flex-start; padding: 9px 14px; text-align: left; }
.class-menu .menu-item .ic { margin-top: 2px; color: var(--ink-3); }
.class-menu .menu-item b { display: block; font-weight: 500; color: var(--ink); font-size: 13px; }
.class-menu .menu-item .small { font-size: 11.5px; }

/* -- the office's dashboard (the demo app's Dashboard: needs you, stats, recent requests, who gave way) ------------ */

<body>
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark" id="markSlot"></span>
      <div class="name"><p class="title">Negotiate, Then Solve</p><p class="dept" id="deptName">Timetable agent</p></div></div>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="side-foot" id="who"></div>
    <button class="collapse" id="collapse" title="Collapse the sidebar (Ctrl B)" aria-label="Collapse the sidebar"></button>
  </aside>
  <div id="app"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const label = (s) => esc(String(s ?? "").replaceAll("_", " "));
let me = null, dep = null, source = null, view = "requests", timer = null;

function remember(key, value) {
  try { if (value !== undefined) localStorage.setItem(key, value); return localStorage.getItem(key); } catch { return null; }
}

// Each browser tab keeps its own session (sessionStorage), so one tab can be a teacher and another the office.
function tabToken(value) {
  try { if (value !== undefined) value ? sessionStorage.setItem("nts.token", value) : sessionStorage.removeItem("nts.token");
    return sessionStorage.getItem("nts.token"); } catch { return null; }
}

async function api(path, opts = {}) {
  const auth = tabToken() ? {Authorization: `Bearer ${tabToken()}`} : {};
  const r = await fetch(path, {headers: {"Content-Type": "application/json", ...auth}, credentials: "same-origin", ...opts});
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; showLogin(); }
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : (body.detail?.message || r.statusText));
  return body;
}

// -- signing in ------------------------------------------------------------------------

// Every tab is its own sign-in (sessionStorage), so one tab can be a teacher and another the office. A link with
// ?as=<name>&dept=<dept> opens a tab already signed in as that person (the demo app's "open a new tab as"), when the
// server signs people in by name alone; the address is then cleaned so a refresh or a copied link does not repeat it.
async function start() {
  const q = new URLSearchParams(location.search), as = q.get("as");
  if (as) {
    history.replaceState(null, "", location.pathname);
    try {
      const d = await api("/api/departments"), dept = q.get("dept") || d.departments[0]?.id;
      if (!d.passwords) {
        const s = await api("/api/login", {method: "POST", body: JSON.stringify({dept, name: as, password: ""})});
        tabToken(s.token); remember("nts.dept", dept);
      }
    } catch { /* fall through to the sign-in page */ }
  }
  try { me = tabToken() ? await api("/api/me") : null; } catch { me = null; }
  me ? enter() : showLogin();
}

const tabLinkAs = (name) => `${location.pathname}?${new URLSearchParams({as: name, dept: me.dept})}`;

// switch who this tab is, or open another tab as someone else; this tab stays as it is
async function switchTo(name) {
  try {
    await api("/api/logout", {method: "POST"});
    const s = await api("/api/login", {method: "POST", body: JSON.stringify({dept: me.dept, name, password: ""})});
    tabToken(s.token); chat = null; officeOpen = null; history.replaceState(null, "", location.pathname); me = await api("/api/me"); enter();
  } catch (e) { alert(e.message); }
}

// the demo app's sign-in (frontend/src/pages/Login.tsx): what the system does on the left, who you are on the right,
// people grouped by what they do. A click signs in; with passwords on, the row opens a password box first.
const LOGIN_STEPS = [
  ["Ask in plain language.", "The agent reads the timetable and the handbook with its tools before it answers."],
  ["It drafts the change, and the solver checks it.", "Nothing it drafts counts until the solver says it fits every rule."],
  ["Colleagues are asked first.", "Whoever's classes would move is asked, with options that already work."],
  ["The office approves before anything changes.", "Everyone affected, and only them, is told."],
];

async function showLogin() {
  clearInterval(timer);
  closeClassMenu();
  $("who").innerHTML = ""; $("nav").innerHTML = ""; $("deptName").textContent = "Timetable agent";
  $("shell").classList.add("signed-out");
  document.title = "Negotiate, Then Solve · Agent";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  let d;
  try { d = await api("/api/departments"); }
  catch (e) { $("app").innerHTML = `<div class="empty">Cannot reach the server (${esc(e.message)}). Start it with <code>python -m nts serve</code>.</div>`; return; }
  let dept = d.departments.some((x) => x.id === remember("nts.dept")) ? remember("nts.dept") : d.departments[0]?.id;
  $("app").innerHTML = `<div class="login-page">
    <aside class="login-story">
      <div class="login-brand">${MARK(26)}<span>Negotiate, Then Solve</span></div>
      <div class="login-pitch">
        <h1>Timetable changes, negotiated and explained.</h1>
        <ol>${LOGIN_STEPS.map(([head, text], i) => `<li><span class="n">${i + 1}</span><div><b>${head}</b><p>${text}</p></div></li>`).join("")}</ol>
      </div>
      <p class="small">LMA Group Project 2026 · research prototype · the agent app</p>
    </aside>
    <section class="login-pick"><div class="login-col">
      <div class="login-brand narrow">${MARK(24)}<span>Negotiate, Then Solve</span></div>
      <h2>Sign in</h2>
      <p class="small">${d.passwords ? "Choose who you are, then enter your password." : "Demo sign-in: choose who you are. The college login replaces this in production."}</p>
      <div id="lworlds"></div>
      <div id="lpeople"></div>
      <p class="small" id="lerr"></p>
    </div></section></div>`;

  const go = async (name, password = "") => {
    $("lerr").textContent = "";
    try {
      const s = await api("/api/login", {method: "POST", body: JSON.stringify({dept, name, password})});
      tabToken(s.token);
      remember("nts.dept", dept); remember("nts.name", name);
      me = await api("/api/me"); enter();
    } catch (e) { $("lerr").textContent = e.message; }
  };
  const row = (key, name, role, lead) => `<div class="lp"><button class="lp-row" data-who="${esc(key)}">${lead}
      <span class="grow"><b>${esc(name)}</b><span class="small">${esc(role)}</span></span>${icon("arrow", 15)}</button>
      <div class="lp-more" data-more="${esc(key)}" hidden></div></div>`;
  const draw = () => {
    const x = d.departments.find((y) => y.id === dept);
    $("lworlds").innerHTML = d.departments.length > 1 ? `<p class="login-lbl">Department</p><div class="worlds">${d.departments.map((w) =>
      `<button class="world ${w.id === dept ? "on" : ""}" data-dept="${esc(w.id)}"><b>${esc(w.id)}</b><span class="small">${w.faculty} teachers</span></button>`).join("")}</div>` : "";
    const groups = [
      ["Administration", [row("office", "The timetable office", "Approves changes, runs the semester plan", avatar("Timetable office"))]],
      ["Faculty", x.teachers.map((t) => row(t, t, "Faculty", avatar(t)))],
      ["Class representatives", (x.sections || []).map((g) => row(`rep: ${g}`, g, "Class representative · asks for the section's students",
        `<span class="avatar" style="--c:${colorFor(g)}">${icon("cap", 14)}</span>`))],
      ["Clubs", [row("club", "A club", "Books rooms for club activities", `<span class="avatar" style="--c:var(--brand)">${icon("music", 14)}</span>`)]],
    ];
    $("lpeople").innerHTML = groups.map(([title, rows]) => `<p class="login-lbl">${title}</p><div class="lp-list">${rows.join("")}</div>`).join("");
    for (const b of document.querySelectorAll("[data-dept]")) b.onclick = () => { dept = b.dataset.dept; draw(); };
    for (const b of document.querySelectorAll("[data-who]")) b.onclick = () => {
      const key = b.dataset.who, more = document.querySelector(`[data-more="${CSS.escape(key)}"]`);
      if (key !== "club" && !d.passwords) { go(key); return; }
      for (const m of document.querySelectorAll("[data-more]")) if (m !== more) m.hidden = true;
      more.hidden = !more.hidden;
      if (more.hidden) return;
      more.innerHTML = `<div class="row">${key === "club" ? `<input id="lclub" placeholder="The club's name, e.g. Robotics club" style="flex:1;min-width:0">` : ""}
        ${d.passwords ? `<input id="lpass" type="password" placeholder="Password" autocomplete="current-password" style="flex:1;min-width:0">` : ""}
        <button class="primary" id="lgo">${icon("arrow", 14)} Continue</button></div>`;
      const submit = () => {
        const name = key === "club" ? `club: ${$("lclub").value.trim()}` : key;
        if (key === "club" && !$("lclub").value.trim()) { $("lclub").focus(); return; }
        go(name, $("lpass")?.value || "");
      };
      $("lgo").onclick = submit;
      for (const i of more.querySelectorAll("input")) i.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      more.querySelector("input")?.focus();
    };
  };
  draw();
}

function colorFor(key) {
  if (COURSE_COLOR[key]) return COURSE_COLOR[key];
  let h = 0x811c9dc5;
  for (const ch of String(key || "")) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return PALETTE[h % PALETTE.length];
}
const initial = (name) => {
  const parts = String(name || "?").replace(/^(dr|prof|mr|mrs|ms)\.?\s+/i, "").split(/[\s,]+/).filter(Boolean);
  return esc(((parts[0]?.[0] ?? "?") + (parts[1]?.[0] ?? "")).toUpperCase());
};
const avatar = (name, cls = "") => `<span class="avatar ${cls}" style="--c:${colorFor(name)}">${initial(name)}</span>`;
const when = (iso) => {  // "Oct 31 · 18:23"
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.toLocaleDateString(undefined, {month: "short", day: "numeric"})} · ${iso.slice(11, 16)}`;
};
// a request's status in the sender's words (the demo app's PLAIN_STATUS); the office keeps the agent's own names
const PLAIN = {running: ["In progress", "running"], waiting: ["Waiting for an answer", "waiting"], submitted: ["Waiting for approval", "submitted"],
  approved: ["Done", "approved"], answered: ["Done", "answered"], declined: ["Couldn't be done", "rejected"], rejected: ["Not approved", "rejected"],

[project]
name = "negotiate-then-solve"
version = "0.1.0"
description = "Conflict-aware university timetabling with LLM agents and constraint solvers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: department-size solves (deselect with -m 'not slow')",
]
